<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000">
  <meta name="description" content="كروة - تطبيق تكسي سريع في العراق">
  <title>كروة 2026 - الرئيسية</title>
  <link rel="preconnect" href="https://carwa-zaid-default-rtdb.firebaseio.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #FF6F00; --dark: #2D3436; --light-bg: #000000; }
    body { background: #000; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Cairo', sans-serif; margin: 0; background-image: radial-gradient(rgba(255, 111, 0, 0.3) 0.5px, transparent 0.5px), radial-gradient(rgba(255, 111, 0, 0.2) 0.5px, transparent 0.5px); background-size: 20px 20px; background-position: 0 0, 10px 10px; }
    body.loading .gate-card { display: none; }
    
    /* شاشة الترحيب (Splash Screen) */
    .splash-screen {
      display: flex;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.35s ease-out, visibility 0.35s ease-out;
    }
    .splash-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .splash-screen .splash-logo {
      max-width: 220px;
      width: 70%;
      height: auto;
      animation: splashPulse 1.2s ease-in-out infinite;
    }
    .splash-screen .splash-text {
      color: var(--primary);
      font-weight: 900;
      font-size: 1.8rem;
      margin-top: 20px;
      letter-spacing: -1px;
    }
    @keyframes splashPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.95; }
    }
    /* splashFadeOut لم يعد مستخدم */
    
    .gate-card { background: #000; padding: 40px 30px; border-radius: 30px; box-shadow: 0 20px 60px rgba(255, 111, 0, 0.15); text-align: center; width: 90%; max-width: 400px; position: relative; overflow-y: auto; max-height: 90vh; border: 1px solid #222; }
    .gate-card .page-logo { max-width: 140px; height: auto; margin-bottom: 15px; }
    h2 { color: var(--primary); font-weight: 900; letter-spacing: -1px; font-size: 2.2rem; }
    .subtitle { color: #999; font-size: 0.95rem; margin-bottom: 30px; font-weight: 600; }
    .btn-choice { width: 100%; margin: 15px 0; padding: 15px; border-radius: 18px; font-weight: 700; border: none; transition: 0.2s; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; }
    .btn-customer { background: var(--dark); color: white; }
    .btn-driver { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(255, 111, 0, 0.3); }
    .btn-choice:active { transform: scale(0.96); }
    .form-section { display: none; text-align: right; margin-top: 10px; animation: slideUp 0.3s; }
    .form-label { font-weight: 700; font-size: 0.9rem; color: #bbb; margin-bottom: 5px; display: block; }
    .form-control { border-radius: 15px; padding: 12px; margin-bottom: 15px; border: 2px solid #333; background: #000; color: #fff; font-family: 'Cairo', sans-serif; font-weight: 600; }
    .form-control:focus { border-color: var(--primary); background: #111; color: #fff; box-shadow: none; }
    .form-control::placeholder { color: #666; }
    .back-btn { cursor: pointer; color: #888; font-size: 0.85rem; margin-bottom: 15px; display: inline-block; font-weight: 700; }
    
    #welcomeBackMsg { display: none; background: #000; color: #64b5f6; padding: 10px; border-radius: 10px; margin-bottom: 15px; font-weight: bold; font-size: 0.9rem; border: 1px solid #333; }
    .btn-choice:disabled { opacity: 0.7; cursor: not-allowed; }
    .toast-msg { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 12px 24px; border-radius: 12px; font-weight: 700; z-index: 9999; animation: toastIn 0.3s; }
    @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body> 

  <!-- شاشة الترحيب (Splash Screen) -->
  <div class="splash-screen">
    <img src="assets/logo.png" alt="كروة" class="splash-logo">
    <span class="splash-text">كروة 2026</span>
  </div>

  <div class="gate-card">
    <img src="assets/logo.png" alt="كروة" class="page-logo">
    <h2 class="mb-1">كروة 2026</h2>
    <p class="subtitle">وجهتك التالية.. تبدأ من هنا</p>

    <div id="welcomeBackMsg"></div>

    <div id="main-menu">
      <button class="btn-choice btn-customer" onclick="showForm('customer')">👤 دخول زبون</button>
      <button class="btn-choice btn-driver" onclick="showForm('driver')">🚖 دخول كابتن</button>
    </div>

    <div id="customer-form" class="form-section">
      <div class="back-btn" onclick="goBack()">عودة للقائمة الرئيسية</div>
      <h5 class="mb-3 fw-bold text-white">حساب زبون جديد</h5>
      
      <label class="form-label">الاسم الكامل *</label>
      <input type="text" id="custName" class="form-control" placeholder="الاسم الثلاثي">
      
      <label class="form-label">رقم الهاتف (عراقي) *</label>
      <input type="tel" id="custPhone" class="form-control" placeholder="07xxxxxxxxx" maxlength="11">
      
      <button id="custSubmitBtn" class="btn-choice btn-driver" onclick="registerUser('customer', this)">تسجيل ودخول</button>
    </div>

    <div id="driver-form" class="form-section">
      <div class="back-btn" onclick="goBack()">عودة للقائمة الرئيسية</div>
      <h5 class="mb-3 fw-bold text-white">تسجيل كابتن جديد</h5>
      
      <label class="form-label">اسم الكابتن *</label>
      <input type="text" id="drvName" class="form-control" placeholder="الاسم الثلاثي">
      
      <label class="form-label">رقم الهاتف (عراقي) *</label>
      <input type="tel" id="drvPhone" class="form-control" placeholder="07xxxxxxxxx" maxlength="11">
      
      <label class="form-label">صورة شخصية للكابتن *</label>
      <input type="file" id="drvPhoto" class="form-control" accept="image/*">

      <label class="form-label">رقم السيارة *</label>
      <input type="text" id="drvCarNum" class="form-control" placeholder="مثال: بغداد 12345 أ">
      
      <label class="form-label">صورة السيارة (من الأمام) *</label>
      <input type="file" id="drvCarPhoto" class="form-control" accept="image/*">
      
      <button id="drvSubmitBtn" class="btn-choice btn-driver" onclick="registerUser('driver', this)">بدء العمل</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <script>
    // إخفاء السبلاش دائماً بعد وقت قصير (بدون اعتماد على Firebase)
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        document.querySelector('.splash-screen')?.classList.add('hidden');
      }, 900);
    });

    // تهيئة deviceId محلياً (لا تتطلب اتصال)
    let deviceId = localStorage.getItem('carwa_device_id');
    if (!deviceId) {
      deviceId = 'dev_' + Math.random().toString(36).substr(2, 9) + Date.now();
      localStorage.setItem('carwa_device_id', deviceId);
    }

    // إعادة توجيه سريع حسب التخزين المحلي (أسرع شيء)
    const cachedType = localStorage.getItem('carwa_user_type');
    if (cachedType === 'customer') { window.location.replace('customer.html'); }
    else if (cachedType === 'driver') { window.location.replace('driver.html'); }

    // Firebase اختياري: يستخدم فقط لربط الجهاز وإظهار رسالة "مرحباً بك"
    let db = null;
    try {
      const firebaseConfig = {
        apiKey: "AIzaSyDkosn3orZqLf5Dd7g32TGUarW5a3MF2Oc",
        databaseURL: "https://carwa-zaid-default-rtdb.firebaseio.com",
        projectId: "carwa-zaid"
      };
      if (window.firebase && firebase.apps && !firebase.apps.length) firebase.initializeApp(firebaseConfig);
      if (window.firebase) db = firebase.database();
    } catch (e) { db = null; }

    (function checkLoginOptional() {
      if (!db) return;
      db.ref('devices/' + deviceId).once('value').then(snap => {
        if (!snap.exists()) return;
        const savedData = snap.val();
        const msgBox = document.getElementById('welcomeBackMsg');
        msgBox.innerHTML = `مرحباً بك مجدداً <b>${savedData.name}</b>`;
        msgBox.style.display = 'block';
        window.boundAccount = savedData;
      }).catch(() => {});
    })();

    function showForm(type) {
      if (window.boundAccount) {
        if(window.boundAccount.type !== type) {
          toast("هذا الجهاز مسجل كـ " + (window.boundAccount.type === 'driver' ? 'كابتن' : 'زبون'));
          type = window.boundAccount.type;
        }
        forceLogin(window.boundAccount);
        return;
      }
      document.getElementById('main-menu').style.display = 'none';
      document.getElementById(type + '-form').style.display = 'block';
    }

    function goBack() {
      document.getElementById('customer-form').style.display = 'none';
      document.getElementById('driver-form').style.display = 'none';
      document.getElementById('main-menu').style.display = 'block';
    }

    function forceLogin(accountData) {
      localStorage.setItem('carwa_user_type', accountData.type);
      if (accountData.type === 'customer') {
        localStorage.setItem('carwa_user_name', accountData.name);
        localStorage.setItem('carwa_user_phone', accountData.phone);
        window.location.href = "customer.html";
      } else {
        localStorage.setItem('carwa_driver_name', accountData.name);
        localStorage.setItem('carwa_driver_phone', accountData.phone);
        window.location.href = "driver.html";
      }
    }

    function validateIraqiPhone(phone) {
        const regex = /^07\d{9}$/; 
        return regex.test(phone);
    }

    function toast(msg) {
      const el = document.createElement('div');
      el.className = 'toast-msg';
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2500);
    }

    function registerUser(type, btn) {
      if (window.boundAccount) {
        toast("جاري الدخول لحسابك...");
        forceLogin(window.boundAccount);
        return;
      }
      if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>جاري...'; }

      if (type === 'customer') {
        const name = document.getElementById('custName').value.trim();
        const phone = document.getElementById('custPhone').value.trim();

        if (!name || !phone) { toast("يرجى ملء جميع الحقول"); if(btn) { btn.disabled = false; btn.innerHTML = 'تسجيل ودخول'; } return; }
        if (!validateIraqiPhone(phone)) {
            toast("رقم هاتف عراقي صحيح: 07xxxxxxxxx");
            if(btn) { btn.disabled = false; btn.innerHTML = 'تسجيل ودخول'; }
            return;
        }
        saveAndRedirect('customer', name, phone, null);

      } else {
        const name = document.getElementById('drvName').value.trim();
        const phone = document.getElementById('drvPhone').value.trim();
        const photoInput = document.getElementById('drvPhoto');
        const carNum = document.getElementById('drvCarNum').value.trim();
        const carPhotoInput = document.getElementById('drvCarPhoto');

        if (!name || !phone || !carNum || !photoInput.files[0] || !carPhotoInput.files[0]) { 
            toast("يرجى ملء جميع الحقول ورفع الصور"); 
            if(btn) { btn.disabled = false; btn.innerHTML = 'بدء العمل'; }
            return; 
        }

        if (!validateIraqiPhone(phone)) {
            toast("رقم هاتف عراقي صحيح: 07xxxxxxxxx");
            if(btn) { btn.disabled = false; btn.innerHTML = 'بدء العمل'; }
            return;
        }

        const reader1 = new FileReader(); 
        reader1.onload = function(e1) {
            const personalPhotoUrl = e1.target.result;
            const reader2 = new FileReader(); 
            reader2.onload = function(e2) {
                const carPhotoUrl = e2.target.result;
                saveAndRedirect('driver', name, phone, personalPhotoUrl, carNum, carPhotoUrl);
            };
            reader2.readAsDataURL(carPhotoInput.files[0]);
        };
        reader1.readAsDataURL(photoInput.files[0]);
      }
    }

    function saveAndRedirect(type, name, phone, photoUrl, carNum = null, carPhotoUrl = null) {
      localStorage.setItem('carwa_user_type', type);
      
      const userData = {
        name: name,
        phone: phone,
        type: type,
        joined: new Date().toISOString()
      };

      if(type === 'customer') {
        localStorage.setItem('carwa_user_name', name);
        localStorage.setItem('carwa_user_phone', phone);
      } 
      else {
        localStorage.setItem('carwa_driver_name', name);
        localStorage.setItem('carwa_driver_phone', phone);
        localStorage.setItem('carwa_driver_photo', photoUrl); 
        
        const expiryDate = new Date();
        expiryDate.setDate(expiryDate.getDate() + 30);
        
        userData.photo = photoUrl;
        userData.carNum = carNum;
        userData.carPhoto = carPhotoUrl;
        userData.subscriptionExpiry = expiryDate.toISOString();
        userData.isLocked = false;
      }

      const updates = {};
      updates[`users/${type}s/${phone}`] = userData;
      updates[`devices/${deviceId}`] = { type: type, phone: phone, name: name };

      if (!db) { window.location.href = type + ".html"; return; }

      db.ref().update(updates).then(() => {
        window.location.href = type + ".html";
      }).catch(() => {
        toast("حدث خطأ، تحقق من الاتصال وحاول مجدداً");
        const cBtn = document.getElementById('custSubmitBtn');
        const dBtn = document.getElementById('drvSubmitBtn');
        if (cBtn) { cBtn.disabled = false; cBtn.innerHTML = 'تسجيل ودخول'; }
        if (dBtn) { dBtn.disabled = false; dBtn.innerHTML = 'بدء العمل'; }
      });
    }
  </script>
</body>
</html>
