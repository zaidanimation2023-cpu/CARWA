<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>كروة - الزبون</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root { --primary: #FF6F00; --dark: #2D3436; --light: #F9F9F9; --shadow: 0 10px 30px rgba(0,0,0,0.1); }
    body, html { height: 100%; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; overflow: hidden; background: white; }
    #map { height: 100vh; width: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
    
    .logout-btn { position: absolute; top: 40px; left: 20px; z-index: 10; background: white; border: none; width: 45px; height: 45px; border-radius: 50%; box-shadow: var(--shadow); color: #dc3545; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }

    .recenter-btn {
      position: absolute; bottom: 320px; right: 20px; z-index: 10;
      background: white; border: none; width: 50px; height: 50px;
      border-radius: 50%; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      color: var(--dark); display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; transition: 0.2s; cursor: pointer;
    }
    .recenter-btn:active { transform: scale(0.9); color: var(--primary); }

    .bottom-sheet { 
      position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 25px; 
      border-radius: 30px 30px 0 0; box-shadow: 0 -5px 40px rgba(0,0,0,0.15); 
      z-index: 100; max-width: 600px; margin: 0 auto; animation: slideUp 0.4s ease-out;
      max-height: 80vh; overflow-y: auto;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    h5 { font-weight: 800; color: var(--dark); margin-bottom: 20px; }
    .search-input { border-radius: 16px; padding: 15px 20px; border: 2px solid #f0f0f0; background: #fdfdfd; font-weight: 600; }
    .search-input:focus { border-color: var(--primary); background: white; box-shadow: none; }

    .btn-confirm { border-radius: 16px; padding: 16px; font-weight: 800; background-color: var(--dark); color: white; border: none; width: 100%; font-size: 1.1rem; margin-top: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .btn-request { background-color: var(--primary); box-shadow: 0 8px 20px rgba(255, 111, 0, 0.3); } 

    .action-buttons { display: flex; gap: 10px; margin-bottom: 15px; }
    .btn-action { flex: 1; border: none; padding: 12px; border-radius: 12px; font-weight: 700; color: white; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-call { background: #3498db; }
    .btn-cancel { background: #e74c3c; }

    .status-badge { background: #FFF3E0; color: var(--primary); padding: 8px 15px; border-radius: 20px; font-size: 0.9rem; font-weight: 700; display: inline-block; margin-bottom: 10px; }

    /* ⭐ بطاقة السائق المبسطة */
    .driver-info-card {
      background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 15px;
      border: 2px solid var(--primary);
      box-shadow: 0 5px 20px rgba(255, 111, 0, 0.2);
    }
    
    .driver-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 111, 0, 0.2);
    }
    .driver-row:last-child { border-bottom: none; }
    
    .driver-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      color: var(--dark);
      font-size: 0.95rem;
    }
    .driver-label i {
      color: var(--primary);
      font-size: 1.1rem;
      width: 25px;
      text-align: center;
    }
    
    .driver-value {
      font-weight: 800;
      color: var(--dark);
      font-size: 1rem;
    }
    
    .car-plate-box {
      background: #2D3436;
      color: white;
      padding: 8px 20px;
      border-radius: 10px;
      font-family: monospace;
      font-size: 1.2rem;
      letter-spacing: 3px;
      font-weight: 900;
    }

    .chat-box { margin-top: 15px; background: #f8f9fa; border-radius: 20px; padding: 15px; border: 1px solid #eee; display: flex; flex-direction: column; gap: 10px; }
    .chat-msgs { height: 120px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .msg { padding: 8px 12px; border-radius: 15px; font-size: 0.85rem; max-width: 85%; }
    .msg.me { background: var(--primary); color: white; align-self: flex-start; border-bottom-right-radius: 2px; }
    .msg.other { background: #e9ecef; color: #333; align-self: flex-end; border-bottom-left-radius: 2px; }
    .chat-input-area { display: flex; gap: 8px; margin-top: 5px; }
    .chat-input { flex: 1; border: 1px solid #ddd; border-radius: 25px; padding: 8px 15px; font-size: 0.9rem; outline: none; }

    .stats-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); z-index: 200; display: none; justify-content: center; align-items: center; }
    .stats-card { background: white; width: 85%; max-width: 360px; border-radius: 30px; padding: 30px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.1); }
    .stat-row { display: flex; justify-content: space-between; margin: 10px 0; padding: 10px; background: #fcfcfc; border-radius: 12px; }
    .price-display { font-size: 2.2rem; color: var(--primary); font-weight: 900; margin: 15px 0; }
  </style>
</head>
<body>

  <div id="map"></div>

  <button class="recenter-btn" onclick="recenterCameraOnUser()" title="موقعي الحالي">
    <i class="fas fa-crosshairs"></i>
  </button>

  <audio id="arriveSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>
  <audio id="driverFoundSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

  <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
  <div class="bottom-sheet" id="ui-container"></div>

  <div class="stats-overlay" id="statsOverlay">
    <div class="stats-card">
      <div style="font-size: 3rem;">🚕</div>
      <h3 class="fw-bold">وصلت بالسلامة!</h3>
      <div class="stat-row"><span>المسافة</span><span id="statDist" class="fw-bold">--</span></div>
      <div class="stat-row"><span>الوقت</span><span id="statTime" class="fw-bold">--</span></div>
      <div class="mt-3"><small class="text-muted">المبلغ المطلوب</small><div class="price-display" id="statPrice">--</div></div>
      <button class="btn btn-dark w-100 mt-2 py-3 rounded-4 fw-bold" onclick="location.reload()">تم</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <script>
    const firebaseConfig = { apiKey: "AIzaSyDkosn3orZqLf5Dd7g32TGUarW5a3MF2Oc", databaseURL: "https://carwa-zaid-default-rtdb.firebaseio.com", projectId: "carwa-zaid" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let map, marker, driverMarker, directionsService, solidRenderer, dashedRenderer;
    let currentStep = 'pickup', pickupPos, destPos, activeOrderId = null, driverData = null;
    const customerName = localStorage.getItem('carwa_user_name') || "عميل";
    const customerPhone = localStorage.getItem('carwa_user_phone') || "";
    
    const savedLat = parseFloat(localStorage.getItem('carwa_last_lat')) || 33.3152;
    const savedLng = parseFloat(localStorage.getItem('carwa_last_lng')) || 44.3661;
    const defaultPos = { lat: savedLat, lng: savedLng };

    function initMap() {
      map = new google.maps.Map(document.getElementById("map"), { center: defaultPos, zoom: 16, disableDefaultUI: true });
      marker = new google.maps.Marker({ map: map, position: defaultPos, draggable: true });
      directionsService = new google.maps.DirectionsService();
      
      solidRenderer = new google.maps.DirectionsRenderer({ map: map, suppressMarkers: true, polylineOptions: { strokeColor: "#FF6F00", strokeWeight: 6 } });
      dashedRenderer = new google.maps.DirectionsRenderer({ map: map, suppressMarkers: true, polylineOptions: { strokeOpacity: 0, icons: [{ icon: { path: 'M 0,-1 0,1', strokeOpacity: 1, scale: 3 }, offset: '0', repeat: '20px' }], strokeColor: "#666", strokeWeight: 2 } });

      renderUI();
    }

    function recenterCameraOnUser() {
      if (navigator.geolocation) {
        document.querySelector('.recenter-btn i').classList.add('fa-spin');
        
        navigator.geolocation.getCurrentPosition(pos => {
          const myPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          map.panTo(myPos);
          map.setZoom(17);
          
          if (currentStep === 'pickup') {
            marker.setPosition(myPos);
            pickupPos = myPos;
            localStorage.setItem('carwa_last_lat', myPos.lat);
            localStorage.setItem('carwa_last_lng', myPos.lng);
          }
          
          document.querySelector('.recenter-btn i').classList.remove('fa-spin');
        }, () => {
          alert("يرجى تفعيل الـ GPS لتحديد موقعك");
          document.querySelector('.recenter-btn i').classList.remove('fa-spin');
        }, { enableHighAccuracy: true });
      }
    }

    // ⭐ دالة عرض بيانات السائق المبسطة (الاسم، الهاتف، رقم السيارة فقط)
    function renderDriverCard(data) {
      const driverName = data.driver || 'الكابتن';
      const driverPhone = data.driverPhone || 'غير متوفر';
      const carPlate = data.carPlate || '-----';
      
      return `
        <div class="driver-info-card">
          <div class="driver-row">
            <div class="driver-label">
              <i class="fas fa-user"></i>
              <span>اسم السائق</span>
            </div>
            <div class="driver-value">${driverName}</div>
          </div>
          
          <div class="driver-row">
            <div class="driver-label">
              <i class="fas fa-phone"></i>
              <span>رقم الهاتف</span>
            </div>
            <div class="driver-value">
              <a href="tel:${driverPhone}" class="text-decoration-none" style="color: var(--primary);">${driverPhone}</a>
            </div>
          </div>
          
          <div class="driver-row" style="justify-content: center; padding-top: 15px;">
            <div class="car-plate-box">
              <i class="fas fa-car-side ms-2"></i>${carPlate}
            </div>
          </div>
        </div>
      `;
    }

    function renderUI(statusText="") {
      const container = document.getElementById('ui-container');
      if (currentStep === 'pickup') {
        container.innerHTML = `<h5>أهلاً ${customerName}، أين موقعك؟</h5><input id="pac-input" class="form-control search-input" placeholder="ابحث عن مكان..."><button class="btn btn-confirm" onclick="confirmPickup()">تأكيد الانطلاق</button>`;
        activateSearch();
      } else if (currentStep === 'dropoff') {
        container.innerHTML = `<h5>إلى أين تريد الذهاب؟</h5><input id="pac-input" class="form-control search-input" placeholder="ابحث عن وجهتك..."><button class="btn btn-confirm" onclick="confirmDestination()">تأكيد الوجهة</button>`;
        activateSearch();
      } else if (currentStep === 'confirm') {
        container.innerHTML = `<h5>ملخص الرحلة</h5><button class="btn btn-confirm btn-request" onclick="sendOrder()">اطلب كروة الآن</button>`;
      } else if (currentStep === 'waiting') {
        container.innerHTML = `
          <div class="text-center py-4">
            <div class="spinner-border text-warning mb-3" style="width: 3rem; height: 3rem;"></div>
            <h5>جاري البحث عن كابتن...</h5>
            <p class="text-muted mb-3">سيتم إشعارك عند العثور على سائق قريب</p>
            <button class="btn btn-cancel" onclick="cancelOrder()">إلغاء الطلب</button>
          </div>`;
      } else if (currentStep === 'tracking') {
        container.innerHTML = `
          ${renderDriverCard(driverData || {})}
          <div class="text-center mb-3 mt-2">
            <span class="status-badge">${statusText}</span>
          </div>
          <div class="action-buttons">
            <a href="tel:${driverData?.driverPhone || ''}" class="btn-action btn-call text-decoration-none"><i class="fas fa-phone-alt"></i> اتصال</a>
            <button class="btn-action btn-cancel" onclick="cancelOrder()"><i class="fas fa-times"></i> إلغاء</button>
          </div>`;
          if(activeOrderId) initChat(activeOrderId);
      }
    }

    function confirmPickup() { 
      const pos = marker.getPosition();
      pickupPos = { lat: pos.lat(), lng: pos.lng() };
      localStorage.setItem('carwa_last_lat', pickupPos.lat);
      localStorage.setItem('carwa_last_lng', pickupPos.lng);
      currentStep = 'dropoff'; renderUI(); 
    }

    function confirmDestination() { 
      destPos = { lat: marker.getPosition().lat(), lng: marker.getPosition().lng() }; 
      currentStep = 'confirm'; marker.setVisible(false); renderUI(); 
      directionsService.route({ origin: pickupPos, destination: destPos, travelMode: 'DRIVING' }, (res) => {
        if(res.status === 'OK') {
          dashedRenderer.setDirections(res);
          const leg = res.routes[0].legs[0];
          window.estimatedTime = leg.duration?.text || '--';
          window.estimatedDist = leg.distance?.text || '--';
        }
      });
    }

    function sendOrder() {
      const oId = "ID_" + Date.now(); 
      activeOrderId = oId;
      
      const orderData = {
        id: oId,
        pickup: pickupPos,
        dest: destPos,
        status: 'pending',
        customerName: customerName,
        customerPhone: customerPhone,
        timestamp: Date.now(),
        estimatedDistance: window.estimatedDist || '--',
        estimatedTime: window.estimatedTime || '--'
      };
      
      db.ref('orders/' + oId).set(orderData)
      .then(() => { 
        currentStep = 'waiting'; 
        renderUI(); 
        trackOrder(oId); 
      })
      .catch(err => {
        alert("حدث خطأ في إرسال الطلب، حاول مرة أخرى");
        console.error(err);
      });
    }

    function trackOrder(orderId) {
      db.ref('orders/' + orderId).on('value', snap => {
        const data = snap.val(); 
        if (!data) return;
        driverData = data;
        
        if (data.status === 'cancelled') { 
          alert("تم إلغاء الرحلة"); 
          location.reload(); 
        }
        
        if (data.status === 'accepted' || data.status === 'in_progress') {
          if (!window.driverFoundPlayed) {
            document.getElementById('driverFoundSound').play().catch(()=>{});
            window.driverFoundPlayed = true;
          }
          
          currentStep = 'tracking'; 
          const statusMsg = data.status === 'accepted' ? "الكابتن في الطريق إليك" : "أنت في الرحلة الآن";
          renderUI(statusMsg);
          
          if(data.driver_location) {
            updateDriverMarker(data.driver_location);
            const target = data.status === 'accepted' ? pickupPos : destPos;
            if(!window.lastRouteStatus || window.lastRouteStatus !== data.status) {
                directionsService.route({ origin: data.driver_location, destination: target, travelMode: 'DRIVING' }, (res) => {
                  if(res.status === 'OK') solidRenderer.setDirections(res);
                });
                window.lastRouteStatus = data.status;
            }
          }
        }
        if (data.status === 'completed') showTripSummary(data);
      });
    }

    function updateDriverMarker(loc) {
      const pos = { lat: loc.lat, lng: loc.lng };
      if (!driverMarker) {
        driverMarker = new google.maps.Marker({
          position: pos, map: map,
          icon: {
            path: "M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z",
            fillColor: "#FF6F00", fillOpacity: 1, strokeColor: "#fff", strokeWeight: 2, scale: 2,
            anchor: new google.maps.Point(12, 22), rotation: loc.heading || 0
          }
        });
      } else {
        driverMarker.setPosition(pos);
        const icon = driverMarker.getIcon();
        icon.rotation = loc.heading || 0;
        driverMarker.setIcon(icon);
      }
      
      if (driverData?.status === 'accepted' && !window.mapFitted) {
        map.panTo(pos);
        map.setZoom(15);
        window.mapFitted = true;
      }
    }

    function initChat(id) {
      db.ref('chats/' + id).limitToLast(20).on('child_added', snap => {
        const m = snap.val();
        const div = document.createElement('div');
        div.className = `msg ${m.sender === 'customer' ? 'me' : 'other'}`;
        div.innerText = m.text;
        const chatMsgs = document.getElementById('chatMsgs');
        if(chatMsgs) {
          chatMsgs.appendChild(div);
          chatMsgs.scrollTop = chatMsgs.scrollHeight;
        }
      });
    }

    function sendMsg() {
      const input = document.getElementById('chatInput');
      if(!input || !input.value.trim() || !activeOrderId) return;
      db.ref('chats/' + activeOrderId).push({ sender: 'customer', text: input.value, time: Date.now() });
      input.value = "";
    }

    function showTripSummary(data) {
      document.getElementById('statDist').innerText = data.distance || window.estimatedDist || "تمت الرحلة";
      document.getElementById('statTime').innerText = data.duration || window.estimatedTime || "--";
      document.getElementById('statPrice').innerText = (data.cost || 0).toLocaleString() + " د.ع";
      document.getElementById('statsOverlay').style.display = 'flex';
      document.getElementById('arriveSound').play().catch(()=>{});
    }

    function activateSearch() {
      setTimeout(() => {
        const input = document.getElementById("pac-input");
        if(input) {
          const auto = new google.maps.places.Autocomplete(input);
          auto.addListener("place_changed", () => {
            const p = auto.getPlace();
            if(p.geometry) { map.setCenter(p.geometry.location); marker.setPosition(p.geometry.location); }
          });
        }
      }, 500);
    }

    function logout() { localStorage.clear(); window.location.href = "index.html"; }
    
    function cancelOrder() { 
      if(confirm("هل أنت متأكد من إلغاء الرحلة؟ سيتم إشعار الكابتن.")) {
        db.ref('orders/' + activeOrderId).update({ 
          status: 'cancelled',
          cancelled_by: 'customer',
          cancelled_at: Date.now()
        }).then(() => {
          location.reload(); 
        }).catch((error) => {
          alert("حدث خطأ في الاتصال، حاول مرة أخرى");
        });
      } 
    }
  </script>
  <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDVsOdieu4zCgOa9ZBASM05vX-DLeTmkc8&libraries=places&language=ar&callback=initMap"></script>
</body>
</html>
