<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>كروة 2026 - الزبون</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root { 
      --primary: #FF6F00; 
      --dark: #2D3436; 
      --bg-color: #000; 
      --text-color: #f0f0f0; 
      --panel-bg: rgba(0,0,0,0.95);
      --panel-border: #222;
      --shadow: 0 10px 30px rgba(255, 111, 0, 0.15);
      --bottom-sheet-padding: 20px;
      --btn-height: 50px;
      --btn-font: 1rem;
      --card-radius: 20px;
    }
    
    body, html { 
      height: 100%; 
      margin: 0; 
      padding: 0; 
      font-family: 'Cairo', sans-serif; 
      overflow: hidden; 
      background: var(--bg-color);
      color: var(--text-color);
      -webkit-tap-highlight-color: transparent;
    }
    
    #map { 
      height: 100vh; 
      width: 100%; 
      position: absolute; 
      top: 0; 
      left: 0; 
      z-index: 1; 
    }
    
    .logout-btn { 
      position: absolute; 
      top: 12px; 
      left: 12px; 
      z-index: 10; 
      background: var(--panel-bg); 
      border: 1px solid var(--panel-border); 
      width: 48px; 
      height: 48px; 
      border-radius: 50%; 
      box-shadow: var(--shadow); 
      color: #dc3545; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 1.2rem;
      transition: transform 0.2s;
    }
    .logout-btn:active { transform: scale(0.9); }

    .recenter-btn {
      position: absolute; 
      bottom: 275px; 
      right: 12px; 
      z-index: 10;
      background: var(--panel-bg); 
      border: 1px solid var(--panel-border); 
      width: 52px; 
      height: 52px;
      border-radius: 50%; 
      box-shadow: 0 4px 15px rgba(255, 111, 0, 0.2);
      color: var(--primary); 
      display: flex; 
      align-items: center; 
      justify-content: center;
      font-size: 1.3rem; 
      transition: 0.2s; 
      cursor: pointer;
    }
    .recenter-btn:active { transform: scale(0.9); }

    .bottom-sheet { 
      position: fixed; 
      bottom: 0; 
      left: 0; 
      right: 0; 
      background: var(--bg-color); 
      padding: var(--bottom-sheet-padding); 
      border-radius: 25px 25px 0 0; 
      box-shadow: 0 -5px 40px rgba(255, 111, 0, 0.15); 
      border-top: 1px solid var(--panel-border);
      z-index: 100; 
      max-width: 100%;
      margin: 0 auto; 
      animation: slideUp 0.4s ease-out;
      max-height: 75vh; 
      overflow-y: auto;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    h5 { 
      font-weight: 800; 
      color: var(--text-color); 
      margin-bottom: 15px;
      font-size: 1.1rem;
    }
    .text-muted { color: #999 !important; }
    
    .search-input { 
      border-radius: 14px; 
      padding: 14px 18px; 
      border: 2px solid var(--panel-border); 
      background: #111; 
      color: var(--text-color);
      font-weight: 600;
      font-size: 0.95rem;
    }
    .search-input:focus { 
      border-color: var(--primary); 
      background: #1a1a1a; 
      box-shadow: none; 
    }
    .search-input::placeholder { color: #666; }

    .btn-confirm { 
      border-radius: 14px; 
      padding: 15px; 
      font-weight: 800; 
      background-color: var(--dark); 
      color: white; 
      border: none; 
      width: 100%; 
      font-size: 1rem; 
      margin-top: 12px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 10px;
      min-height: var(--btn-height);
    }
    .btn-confirm:active { transform: scale(0.98); }
    .btn-request { 
      background-color: var(--primary); 
      box-shadow: 0 8px 20px rgba(255, 111, 0, 0.3); 
    } 

    .action-buttons { 
      display: flex; 
      gap: 10px; 
      margin-bottom: 12px; 
    }
    
    .btn-action { 
      flex: 1; 
      border: none; 
      padding: 13px; 
      border-radius: 12px; 
      font-weight: 700; 
      color: white; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 8px;
      min-height: var(--btn-height);
      font-size: 0.9rem;
    }
    .btn-action:active { transform: scale(0.97); }
    .btn-call { background: #3498db; }
    .btn-cancel { background: #e74c3c; }
    .btn-chat { background: #9b59b6; }

    .status-badge { 
      background: rgba(255, 111, 0, 0.2); 
      color: var(--primary); 
      padding: 7px 14px; 
      border-radius: 18px; 
      font-size: 0.85rem; 
      font-weight: 700; 
      display: inline-block; 
      margin-bottom: 10px; 
      border: 1px solid rgba(255, 111, 0, 0.4);
    }

    .driver-info-card {
      background: rgba(255, 111, 0, 0.08);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 12px;
      border: 1px solid var(--panel-border);
      box-shadow: 0 5px 20px rgba(255, 111, 0, 0.15);
    }
    
    .driver-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--panel-border);
    }
    .driver-row:last-child { border-bottom: none; }
    
    .driver-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      color: #bbb;
      font-size: 0.9rem;
    }
    .driver-label i {
      color: var(--primary);
      font-size: 1rem;
      width: 22px;
      text-align: center;
    }
    
    .driver-value {
      font-weight: 800;
      color: var(--text-color);
      font-size: 0.95rem;
    }
    
    .car-plate-box {
      background: var(--dark);
      color: white;
      padding: 7px 18px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 1.1rem;
      letter-spacing: 2px;
      font-weight: 900;
    }

    .chat-float-btn { 
      position: fixed; 
      bottom: 25px; 
      left: 15px; 
      z-index: 90; 
      width: 52px; 
      height: 52px; 
      border-radius: 50%; 
      background: var(--dark); 
      color: white; 
      border: none; 
      box-shadow: 0 5px 25px rgba(255, 111, 0, 0.3); 
      display: none; 
      align-items: center; 
      justify-content: center; 
      font-size: 1.2rem;
      transition: transform 0.2s;
    }
    .chat-float-btn:active { transform: scale(0.9); }
    
    .chat-popup { 
      position: fixed; 
      bottom: 85px; 
      left: 15px; 
      width: calc(100% - 30px);
      max-width: 320px; 
      background: var(--bg-color); 
      border-radius: 20px; 
      z-index: 100; 
      box-shadow: 0 10px 45px rgba(0,0,0,0.5); 
      display: none; 
      flex-direction: column; 
      overflow: hidden; 
      border: 1px solid var(--panel-border); 
    }
    .chat-popup-header {
      background: var(--dark); 
      color: white; 
      padding: 12px 15px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
    }
    .chat-popup-header span {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .chat-popup-header button {
      width: 30px;
      height: 30px;
      font-size: 1rem;
      padding: 0;
    }
    .chat-msgs { 
      height: 150px; 
      overflow-y: auto; 
      display: flex; 
      flex-direction: column; 
      gap: 6px;
      padding: 12px;
      background: #111; 
    }
    .msg { 
      padding: 7px 11px; 
      border-radius: 13px; 
      font-size: 0.8rem; 
      max-width: 85%; 
      word-wrap: break-word;
    }
    .msg.me { 
      background: var(--primary); 
      color: white; 
      align-self: flex-start; 
      border-bottom-right-radius: 2px; 
    }
    .msg.other { 
      background: #333; 
      color: var(--text-color); 
      align-self: flex-end; 
      border-bottom-left-radius: 2px; 
    }
    .chat-input-area { 
      display: flex; 
      gap: 6px; 
      padding: 10px;
      background: var(--bg-color);
      border-top: 1px solid var(--panel-border);
    }
    .chat-input { 
      flex: 1; 
      border: 1px solid var(--panel-border); 
      border-radius: 22px; 
      padding: 8px 13px; 
      font-size: 0.85rem; 
      outline: none; 
      background: #111;
      color: var(--text-color);
    }
    .chat-input::placeholder { color: #666; }
    .chat-input-area button {
      width: 42px;
      height: 42px;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .stats-overlay { 
      position: fixed; 
      top: 0; 
      left: 0; 
      right: 0; 
      bottom: 0; 
      background: rgba(0,0,0,0.95); 
      backdrop-filter: blur(10px); 
      z-index: 200; 
      display: none; 
      justify-content: center; 
      align-items: center;
      padding: 20px;
    }
    .stats-card { 
      background: var(--bg-color); 
      width: 90%; 
      max-width: 340px; 
      border-radius: 25px; 
      padding: 25px 20px; 
      text-align: center; 
      box-shadow: 0 20px 60px rgba(255, 111, 0, 0.2); 
      border: 1px solid var(--panel-border);
      color: var(--text-color);
    }
    .stat-row { 
      display: flex; 
      justify-content: space-between; 
      margin: 8px 0; 
      padding: 8px; 
      background: rgba(255,255,255,0.05); 
      border-radius: 10px;
      font-size: 0.9rem;
      border: 1px solid var(--panel-border);
    }
    .price-display { 
      font-size: 2rem; 
      color: var(--primary); 
      font-weight: 900; 
      margin: 12px 0; 
    }

    @media (max-width: 360px) {
      :root {
        --bottom-sheet-padding: 15px;
        --btn-height: 45px;
        --btn-font: 0.85rem;
        --card-radius: 18px;
      }
      .logout-btn { width: 44px; height: 44px; font-size: 1.1rem; }
      .recenter-btn { width: 48px; height: 48px; font-size: 1.2rem; bottom: 255px; }
      .btn-confirm, .btn-action { padding: 12px; font-size: 0.85rem; }
      .price-display { font-size: 1.7rem; }
      h5 { font-size: 1rem; }
      .driver-info-card { padding: 15px; }
      .car-plate-box { font-size: 1rem; padding: 6px 14px; }
      .chat-float-btn { width: 48px; height: 48px; font-size: 1.2rem; }
      .chat-popup { bottom: 75px; }
    }

    @media (min-width: 768px) {
      .bottom-sheet { max-width: 420px; }
      .stats-card { max-width: 380px; }
      .chat-popup { max-width: 380px; }
    }

    @media (hover: none) and (pointer: coarse) {
      .btn-confirm, .btn-action, .btn-request {
        min-height: 50px;
      }
      .logout-btn, .recenter-btn, .chat-float-btn {
        min-width: 50px;
        min-height: 50px;
      }
    }

    .bottom-sheet::-webkit-scrollbar { width: 4px; }
    .bottom-sheet::-webkit-scrollbar-track { background: #222; border-radius: 10px; }
    .bottom-sheet::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
  </style>
</head>
<body>

  <div id="map"></div>

  <button class="recenter-btn" onclick="recenterCameraOnUser()" title="موقعي الحالي">
    <i class="fas fa-crosshairs"></i>
  </button>

  <button id="chatBtn" class="chat-float-btn" onclick="toggleChat()">
    <i class="fas fa-comment-dots"></i>
  </button>
  
  <div id="chatWindow" class="chat-popup">
    <div class="chat-popup-header">
      <span><i class="fas fa-user-circle ms-2"></i>الكابتن</span>
      <button class="btn btn-sm text-white p-0" onclick="toggleChat()">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div class="chat-msgs" id="chatMsgs"></div>
    <div class="chat-input-area">
      <input type="text" id="chatInput" class="chat-input" placeholder="اكتب رسالة...">
      <button class="btn btn-warning rounded-circle" onclick="sendMsg()">
        <i class="fas fa-paper-plane"></i>
      </button>
    </div>
  </div>

  <audio id="arriveSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>
  <audio id="driverFoundSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

  <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
  <div class="bottom-sheet" id="ui-container"></div>

  <div class="stats-overlay" id="statsOverlay">
    <div class="stats-card">
      <div style="font-size: 2.5rem;">🚕</div>
      <h3 class="fw-bold" style="font-size:1.2rem;">وصلت بالسلامة!</h3>
      <div class="stat-row"><span>المسافة</span><span id="statDist" class="fw-bold">--</span></div>
      <div class="stat-row"><span>الوقت</span><span id="statTime" class="fw-bold">--</span></div>
      <div class="mt-3"><small class="text-muted">المبلغ المطلوب</small><div class="price-display" id="statPrice">--</div></div>
      <button class="btn btn-dark w-100 mt-2 py-3 rounded-4 fw-bold" onclick="location.reload()">تم</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <script>
    const firebaseConfig = { apiKey: "AIzaSyDkosn3orZqLf5Dd7g32TGUarW5a3MF2Oc", databaseURL: "https://carwa-zaid-default-rtdb.firebaseio.com", projectId: "carwa-zaid" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let map, marker, driverMarker, directionsService, solidRenderer, dashedRenderer;
    let currentStep = 'pickup', pickupPos, destPos, activeOrderId = null, driverData = null;
    const customerName = localStorage.getItem('carwa_user_name') || "عميل";
    const customerPhone = localStorage.getItem('carwa_user_phone') || "";
    
    const savedLat = parseFloat(localStorage.getItem('carwa_last_lat')) || 33.3152;
    const savedLng = parseFloat(localStorage.getItem('carwa_last_lng')) || 44.3661;
    const defaultPos = { lat: savedLat, lng: savedLng };

    const darkMapStyle = [
      { "elementType": "geometry", "stylers": [{ "color": "#242f3e" }] },
      { "elementType": "labels.text.stroke", "stylers": [{ "color": "#242f3e" }] },
      { "elementType": "labels.text.fill", "stylers": [{ "color": "#746855" }] },
      { "featureType": "road", "elementType": "geometry", "stylers": [{ "color": "#38414e" }] },
      { "featureType": "road", "elementType": "geometry.stroke", "stylers": [{ "color": "#212a37" }] },
      { "featureType": "water", "elementType": "geometry", "stylers": [{ "color": "#17263c" }] }
    ];

    function initMap() {
      map = new google.maps.Map(document.getElementById("map"), { 
        center: defaultPos, 
        zoom: 16, 
        disableDefaultUI: true,
        styles: darkMapStyle
      });
      marker = new google.maps.Marker({ map: map, position: defaultPos, draggable: true });
      directionsService = new google.maps.DirectionsService();
      
      solidRenderer = new google.maps.DirectionsRenderer({ map: map, suppressMarkers: true, polylineOptions: { strokeColor: "#FF6F00", strokeWeight: 6 } });
      dashedRenderer = new google.maps.DirectionsRenderer({ map: map, suppressMarkers: true, polylineOptions: { strokeOpacity: 0, icons: [{ icon: { path: 'M 0,-1 0,1', strokeOpacity: 1, scale: 3 }, offset: '0', repeat: '20px' }], strokeColor: "#666", strokeWeight: 2 } });

      renderUI();
    }

    function recenterCameraOnUser() {
      if (navigator.geolocation) {
        document.querySelector('.recenter-btn i').classList.add('fa-spin');
        
        navigator.geolocation.getCurrentPosition(pos => {
          const myPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          map.panTo(myPos);
          map.setZoom(17);
          
          if (currentStep === 'pickup') {
            marker.setPosition(myPos);
            pickupPos = myPos;
            localStorage.setItem('carwa_last_lat', myPos.lat);
            localStorage.setItem('carwa_last_lng', myPos.lng);
          }
          
          document.querySelector('.recenter-btn i').classList.remove('fa-spin');
        }, () => {
          alert("يرجى تفعيل الـ GPS لتحديد موقعك");
          document.querySelector('.recenter-btn i').classList.remove('fa-spin');
        }, { enableHighAccuracy: true });
      }
    }

    function renderDriverCard(data) {
      const driverName = data.driver || 'الكابتن';
      const driverPhone = data.driverPhone || 'غير متوفر';
      const carPlate = data.carPlate || '-----';
      
      return `
        <div class="driver-info-card">
          <div class="driver-row">
            <div class="driver-label">
              <i class="fas fa-user"></i>
              <span>اسم السائق</span>
            </div>
            <div class="driver-value">${driverName}</div>
          </div>
          
          <div class="driver-row">
            <div class="driver-label">
              <i class="fas fa-phone"></i>
              <span>رقم الهاتف</span>
            </div>
            <div class="driver-value">
              <a href="tel:${driverPhone}" class="text-decoration-none" style="color: var(--primary);">${driverPhone}</a>
            </div>
          </div>
          
          <div class="driver-row" style="justify-content: center; padding-top: 12px;">
            <div class="car-plate-box">
              <i class="fas fa-car-side ms-2"></i>${carPlate}
            </div>
          </div>
        </div>
      `;
    }

    function renderUI(statusText="") {
      const container = document.getElementById('ui-container');
      if (currentStep === 'pickup') {
        container.innerHTML = `<h5>أهلاً ${customerName}، أين موقعك؟</h5><input id="pac-input" class="form-control search-input" placeholder="ابحث عن مكان..."><button class="btn btn-confirm" onclick="confirmPickup()">تأكيد الانطلاق</button>`;
        activateSearch();
      } else if (currentStep === 'dropoff') {
        container.innerHTML = `<h5>إلى أين تريد الذهاب؟</h5><input id="pac-input" class="form-control search-input" placeholder="ابحث عن وجهتك..."><button class="btn btn-confirm" onclick="confirmDestination()">تأكيد الوجهة</button>`;
        activateSearch();
      } else if (currentStep === 'confirm') {
        container.innerHTML = `<h5>ملخص الرحلة</h5><button class="btn btn-confirm btn-request" onclick="sendOrder()">اطلب كروة الآن</button>`;
      } else if (currentStep === 'waiting') {
        container.innerHTML = `
          <div class="text-center py-4">
            <div class="spinner-border text-warning mb-3" style="width: 2.5rem; height: 2.5rem;"></div>
            <h5>جاري البحث عن كابتن...</h5>
            <p class="text-muted mb-3" style="font-size:0.85rem;">سيتم إشعارك عند العثور على سائق قريب</p>
            <button class="btn btn-outline-danger" onclick="cancelOrder()" style="min-height:45px;">إلغاء الطلب</button>
          </div>`;
      } else if (currentStep === 'tracking') {
        container.innerHTML = `
          ${renderDriverCard(driverData || {})}
          <div class="text-center mb-3 mt-2">
            <span class="status-badge">${statusText}</span>
          </div>
          <div class="action-buttons">
            <a href="tel:${driverData?.driverPhone || ''}" class="btn-action btn-call text-decoration-none"><i class="fas fa-phone-alt"></i> اتصال</a>
            <button class="btn-action btn-chat" onclick="toggleChat()"><i class="fas fa-comment"></i> رسالة</button>
            <button class="btn-action btn-cancel" onclick="cancelOrder()"><i class="fas fa-times"></i> إلغاء</button>
          </div>`;
        if(activeOrderId) initChat(activeOrderId);
      }
    }

    function toggleChat() {
      const chatBtn = document.getElementById('chatBtn');
      const chatWindow = document.getElementById('chatWindow');
      if (chatWindow.style.display === 'flex') {
        chatWindow.style.display = 'none';
        chatBtn.style.display = 'flex';
      } else {
        chatWindow.style.display = 'flex';
        chatBtn.style.display = 'none';
      }
    }

    function confirmPickup() { 
      const pos = marker.getPosition();
      pickupPos = { lat: pos.lat(), lng: pos.lng() };
      localStorage.setItem('carwa_last_lat', pickupPos.lat);
      localStorage.setItem('carwa_last_lng', pickupPos.lng);
      currentStep = 'dropoff'; renderUI(); 
    }

    function confirmDestination() { 
      destPos = { lat: marker.getPosition().lat(), lng: marker.getPosition().lng() }; 
      currentStep = 'confirm'; marker.setVisible(false); renderUI(); 
      directionsService.route({ origin: pickupPos, destination: destPos, travelMode: 'DRIVING' }, (res) => {
        if(res.status === 'OK') {
          dashedRenderer.setDirections(res);
          const leg = res.routes[0].legs[0];
          window.estimatedTime = leg.duration?.text || '--';
          window.estimatedDist = leg.distance?.text || '--';
        }
      });
    }

    function sendOrder() {
      const oId = "ID_" + Date.now(); 
      activeOrderId = oId;
      
      const orderData = {
        id: oId,
        pickup: pickupPos,
        dest: destPos,
        status: 'pending',
        customerName: customerName,
        customerPhone: customerPhone,
        timestamp: Date.now(),
        estimatedDistance: window.estimatedDist || '--',
        estimatedTime: window.estimatedTime || '--'
      };
      
      db.ref('orders/' + oId).set(orderData)
      .then(() => { 
        currentStep = 'waiting'; 
        renderUI(); 
        trackOrder(oId); 
      })
      .catch(err => {
        alert("حدث خطأ في إرسال الطلب، حاول مرة أخرى");
        console.error(err);
      });
    }

    function trackOrder(orderId) {
      db.ref('orders/' + orderId).on('value', snap => {
        const data = snap.val(); 
        if (!data) return;
        driverData = data;
        
        if (data.status === 'cancelled') { 
          alert("تم إلغاء الرحلة"); 
          location.reload(); 
        }
        
        if (data.status === 'accepted' || data.status === 'in_progress') {
          if (!window.driverFoundPlayed) {
            document.getElementById('driverFoundSound').play().catch(()=>{});
            window.driverFoundPlayed = true;
          }
          
          currentStep = 'tracking'; 
          const statusMsg = data.status === 'accepted' ? "الكابتن في الطريق إليك" : "أنت في الرحلة الآن";
          renderUI(statusMsg);
          
          document.getElementById('chatBtn').style.display = 'flex';
          
          if(data.driver_location) {
            updateDriverMarker(data.driver_location);
            const target = data.status === 'accepted' ? pickupPos : destPos;
            if(!window.lastRouteStatus || window.lastRouteStatus !== data.status) {
                directionsService.route({ origin: data.driver_location, destination: target, travelMode: 'DRIVING' }, (res) => {
                  if(res.status === 'OK') solidRenderer.setDirections(res);
                });
                window.lastRouteStatus = data.status;
            }
          }
        }
        if (data.status === 'completed') showTripSummary(data);
      });
    }

    function updateDriverMarker(loc) {
      const pos = { lat: loc.lat, lng: loc.lng };
      if (!driverMarker) {
        driverMarker = new google.maps.Marker({
          position: pos, map: map,
          icon: {
            path: "M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z",
            fillColor: "#FF6F00", fillOpacity: 1, strokeColor: "#fff", strokeWeight: 2, scale: 2,
            anchor: new google.maps.Point(12, 22), rotation: loc.heading || 0
          }
        });
      } else {
        driverMarker.setPosition(pos);
        const icon = driverMarker.getIcon();
        icon.rotation = loc.heading || 0;
        driverMarker.setIcon(icon);
      }
      
      if (driverData?.status === 'accepted' && !window.mapFitted) {
        map.panTo(pos);
        map.setZoom(15);
        window.mapFitted = true;
      }
    }

    function initChat(id) {
      const chatMsgs = document.getElementById('chatMsgs');
      if(chatMsgs) chatMsgs.innerHTML = '';
      
      db.ref('chats/' + id).limitToLast(20).on('child_added', snap => {
        const m = snap.val();
        const div = document.createElement('div');
        div.className = `msg ${m.sender === 'customer' ? 'me' : 'other'}`;
        div.innerText = m.text;
        if(chatMsgs) {
          chatMsgs.appendChild(div);
          chatMsgs.scrollTop = chatMsgs.scrollHeight;
        }
      });
    }

    function sendMsg() {
      const input = document.getElementById('chatInput');
      if(!input || !input.value.trim() || !activeOrderId) return;
      db.ref('chats/' + activeOrderId).push({ 
        sender: 'customer', 
        text: input.value.trim(), 
        time: Date.now() 
      });
      input.value = "";
    }

    function showTripSummary(data) {
      document.getElementById('statDist').innerText = data.distance || window.estimatedDist || "تمت الرحلة";
      document.getElementById('statTime').innerText = data.duration || window.estimatedTime || "--";
      document.getElementById('statPrice').innerText = (data.cost || 0).toLocaleString() + " د.ع";
      document.getElementById('statsOverlay').style.display = 'flex';
      document.getElementById('arriveSound').play().catch(()=>{});
    }

    function activateSearch() {
      setTimeout(() => {
        const input = document.getElementById("pac-input");
        if(input) {
          const auto = new google.maps.places.Autocomplete(input);
          auto.addListener("place_changed", () => {
            const p = auto.getPlace();
            if(p.geometry) { map.setCenter(p.geometry.location); marker.setPosition(p.geometry.location); }
          });
        }
      }, 500);
    }

    function logout() { localStorage.clear(); window.location.href = "index.html"; }
    
    function cancelOrder() { 
      if(confirm("هل أنت متأكد من إلغاء الرحلة؟ سيتم إشعار الكابتن.")) {
        db.ref('orders/' + activeOrderId).update({ 
          status: 'cancelled',
          cancelled_by: 'customer',
          cancelled_at: Date.now()
        }).then(() => {
          location.reload(); 
        }).catch((error) => {
          alert("حدث خطأ في الاتصال، حاول مرة أخرى");
        });
      } 
    }
  </script>
  <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDVsOdieu4zCgOa9ZBASM05vX-DLeTmkc8&libraries=places&language=ar&callback=initMap"></script>
