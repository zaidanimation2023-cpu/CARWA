<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>كروة - كابتن العراق</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root { --primary: #FF6F00; --dark: #2D3436; --shadow: 0 4px 20px rgba(0,0,0,0.15); }
    body, html { height: 100%; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; overflow: hidden; background: white; }
    #map { height: 100vh; width: 100%; position: absolute; top:0; left:0; z-index: 1; }
    
    /* زر إعادة الكاميرا لموقع السيارة */
    .recenter-btn {
      position: absolute; bottom: 120px; right: 20px; z-index: 10;
      background: white; border: none; width: 55px; height: 55px;
      border-radius: 50%; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      color: var(--dark); display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; transition: 0.2s; cursor: pointer; pointer-events: auto;
    }
    .recenter-btn:active { transform: scale(0.9); color: var(--primary); }
    .recenter-btn.active { color: var(--primary); border: 2px solid var(--primary); }

    .ui-top { position: relative; z-index: 10; padding: 20px; pointer-events: none; }
    .panel-info { 
      background: rgba(255,255,255,0.95); backdrop-filter: blur(10px);
      padding: 15px 20px; border-radius: 20px; pointer-events: auto; 
      max-width: 450px; box-shadow: var(--shadow); margin: 0 auto; border: 1px solid #eee;
    }
    h6 { font-weight: 800; color: var(--primary); margin: 0; font-size: 1rem; }
    .btn-logout { border: 1px solid #fee; color: #dc3545; background: white; border-radius: 15px; font-size: 0.8rem; font-weight: 700; padding: 4px 12px; border: 1px solid #dc3545; }
    #statusPanel { margin-top: 10px; padding-top: 10px; border-top: 1px solid #eee; font-size: 0.9rem; font-weight: 600; color: #555; }
    
    .trip-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .btn-action { width: 100%; font-weight: 800; border-radius: 12px; padding: 12px; font-size: 0.95rem; border: none; box-shadow: var(--shadow); transition: 0.2s; }
    .btn-start { background: var(--primary); color: white; grid-column: span 2; }
    .btn-finish { background: #2ecc71; color: white; grid-column: span 2; }
    .btn-call { background: #3498db; color: white; }
    .btn-cancel { background: #e74c3c; color: white; }
    
    .btn-accept-map { background: var(--primary); color: white; border: none; font-weight: 700; width: 100%; border-radius: 8px; margin-top: 5px; padding: 6px; font-size: 0.9rem; }

    .subscription-blocker {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: white; z-index: 9999; display: none;
      flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 30px;
    }
    .sub-icon { font-size: 4.5rem; color: #dc3545; margin-bottom: 20px; }
    .sub-input { 
      text-align: center; font-size: 1.8rem; letter-spacing: 5px; 
      border: 2px solid #eee; border-radius: 15px; padding: 15px; 
      width: 100%; max-width: 320px; margin: 20px 0; outline: none;
    }
    .btn-unlock { background: var(--dark); color: white; width: 100%; max-width: 320px; padding: 15px; border-radius: 15px; font-weight: bold; border: none; }

    .chat-float-btn { position: fixed; bottom: 35px; left: 25px; z-index: 90; width: 60px; height: 60px; border-radius: 50%; background: var(--dark); color: white; border: none; box-shadow: 0 5px 25px rgba(0,0,0,0.3); display: none; align-items: center; justify-content: center; font-size: 1.5rem; }
    .chat-popup { position: fixed; bottom: 105px; left: 25px; width: 330px; max-width: 90vw; background: white; border-radius: 20px; z-index: 100; box-shadow: 0 10px 45px rgba(0,0,0,0.25); display: none; flex-direction: column; overflow: hidden; border: 1px solid #eee; }
    .chat-header { background: var(--dark); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
    .chat-msgs { height: 260px; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #f8f9fa; }
    .msg { padding: 10px 15px; border-radius: 15px; font-size: 0.9rem; max-width: 80%; line-height: 1.4; }
    .msg.me { background: var(--primary); color: white; align-self: flex-start; border-bottom-right-radius: 2px; }
    .msg.other { background: #e9ecef; color: #333; align-self: flex-end; border-bottom-left-radius: 2px; }
    .chat-footer { padding: 10px; display: flex; gap: 10px; background: white; border-top: 1px solid #eee; }
    .chat-input { flex: 1; border: 1px solid #ddd; border-radius: 25px; padding: 10px 18px; outline: none; }

    .stats-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.95); backdrop-filter: blur(8px); z-index: 200; display: none; justify-content: center; align-items: center; }
    .stats-card { background: white; width: 90%; max-width: 380px; border-radius: 30px; padding: 40px 30px; text-align: center; box-shadow: 0 15px 50px rgba(0,0,0,0.15); border: 1px solid #eee; }
    .price-display { font-size: 2.5rem; color: var(--primary); font-weight: 900; margin: 20px 0; }
  </style>
</head>
<body>

  <div id="subBlocker" class="subscription-blocker">
    <i class="fas fa-id-card-alt sub-icon"></i>
    <h3 class="fw-bold mb-2">عفواً.. الحساب مقيد</h3>
    <p class="text-muted mb-4">يرجى تجديد الاشتراك أو إدخال كود التفعيل (PIN)</p>
    <input type="number" id="pinInput" class="sub-input" placeholder="000000">
    <button class="btn-unlock" onclick="redeemPin()">تفعيل الآن</button>
    <button onclick="logout()" class="btn btn-link text-muted mt-3">تسجيل خروج</button>
  </div>

  <div id="map"></div>
  
  <button id="recenterBtn" class="recenter-btn active" onclick="recenterCamera()" title="تتبع السيارة">
    <i class="fas fa-location-arrow"></i>
  </button>

  <audio id="orderSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

  <div class="ui-top">
    <div class="panel-info" id="mainPanel">
      <div class="d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
          <i class="fas fa-taxi text-warning"></i>
          <h6 id="driverTitle">جاري التحميل...</h6>
        </div>
        <button onclick="logout()" class="btn-logout">خروج</button>
      </div>
      <div id="statusPanel">
        <div class="d-flex align-items-center gap-2">
          <div class="spinner-grow spinner-grow-sm text-warning" role="status"></div>
          <span id="logTxt">في انتظار الطلبات...</span>
        </div>
      </div>
      <div id="tripControls" style="display:none;"></div>
    </div>
  </div>

  <button id="chatBtn" class="chat-float-btn" onclick="toggleChat()"><i class="fas fa-comment-dots"></i></button>
  <div id="chatWindow" class="chat-popup">
    <div class="chat-header"><span>الزبون</span><button class="btn btn-sm text-white" onclick="toggleChat()">×</button></div>
    <div class="chat-msgs" id="chatMsgs"></div>
    <div class="chat-footer">
      <input type="text" id="chatInput" class="chat-input" placeholder="اكتب هنا...">
      <button class="btn btn-warning rounded-circle" onclick="sendMsg()"><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>

  <div class="stats-overlay" id="statsOverlay">
    <div class="stats-card">
      <h3 class="fw-bold mb-3">نهاية الرحلة ✅</h3>
      <div class="mb-2 text-muted">المسافة المقطوعة</div>
      <div id="statDist" class="fw-bold fs-4">--</div>
      <div class="mt-4 text-muted">المبلغ المستحق</div>
      <div class="price-display" id="statPrice">0 د.ع</div>
      <button class="btn btn-dark w-100 mt-3 py-3 rounded-4 fw-bold" onclick="location.reload()">تم استلام المبلغ</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDVsOdieu4zCgOa9ZBASM05vX-DLeTmkc8&language=ar&v=beta"></script>

  <script>
    const firebaseConfig = { apiKey: "AIzaSyDkosn3orZqLf5Dd7g32TGUarW5a3MF2Oc", databaseURL: "https://carwa-zaid-default-rtdb.firebaseio.com", projectId: "carwa-zaid" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let map, markers = {}, directionsService, solidRenderer;
    let driverMarker = null, currentOrder = null, tripStats = { distanceVal: 0, distance: '' };
    let isAutoFollow = true; // متغير للتحكم في التتبع التلقائي
    const driverName = localStorage.getItem('carwa_driver_name') || "كابتن";
    const driverPhone = localStorage.getItem('carwa_driver_phone');
    document.getElementById('driverTitle').innerText = driverName;

    const silverStyle = [ { "elementType": "geometry", "stylers": [{ "color": "#f5f5f5" }] }, { "elementType": "labels.icon", "stylers": [{ "visibility": "off" }] }, { "featureType": "road", "elementType": "geometry", "stylers": [{ "color": "#ffffff" }] } ];

    function initMap() {
      const savedPos = { 
        lat: parseFloat(localStorage.getItem('carwa_driver_lat')) || 33.3152, 
        lng: parseFloat(localStorage.getItem('carwa_driver_lng')) || 44.3661 
      };

      map = new google.maps.Map(document.getElementById("map"), {
        center: savedPos,
        zoom: 14,
        disableDefaultUI: true,
        styles: silverStyle,
        tilt: 0,
        heading: 0,
        mapId: '90f87356969d889c' 
      });

      // إذا قام المستخدم بسحب الخريطة، نوقف التتبع التلقائي
      map.addListener('dragstart', () => {
        isAutoFollow = false;
        document.getElementById('recenterBtn').classList.remove('active');
      });

      directionsService = new google.maps.DirectionsService();
      solidRenderer = new google.maps.DirectionsRenderer({ 
        map: map, 
        suppressMarkers: true, 
        polylineOptions: { strokeColor: "#FF6F00", strokeWeight: 7, strokeOpacity: 0.9 } 
      });

      driverMarker = new google.maps.Marker({
        position: savedPos,
        map: map,
        icon: { url: "https://cdn-icons-png.flaticon.com/512/3097/3097180.png", scaledSize: new google.maps.Size(45, 45), anchor: new google.maps.Point(22, 22) }
      });

      listenForOrders();
      startGpsTracking();
    }

    // دالة إعادة التمركز
    function recenterCamera() {
      isAutoFollow = true;
      document.getElementById('recenterBtn').classList.add('active');
      const lat = parseFloat(localStorage.getItem('carwa_driver_lat'));
      const lng = parseFloat(localStorage.getItem('carwa_driver_lng'));
      if (lat && lng) {
        const latLng = new google.maps.LatLng(lat, lng);
        map.panTo(latLng);
        map.setZoom(currentOrder ? 19 : 17);
      }
    }

    function startGpsTracking() {
      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(pos => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          const heading = pos.coords.heading || 0;
          const latLng = new google.maps.LatLng(lat, lng);

          localStorage.setItem('carwa_driver_lat', lat);
          localStorage.setItem('carwa_driver_lng', lng);

          if (driverMarker) driverMarker.setPosition(latLng);

          // المطاردة التلقائية للكاميرا
          if (isAutoFollow) {
            map.panTo(latLng);
            if (currentOrder) {
              map.setZoom(19);
              map.setTilt(55);
              if (heading > 0) map.setHeading(heading);
            }
          }

          if (currentOrder) {
            db.ref('orders/' + currentOrder.id + '/driver_location').set({ lat, lng, heading });
          }
        }, null, { enableHighAccuracy: true });
      }
    }

    function listenForOrders() {
      db.ref('orders').on('value', snap => {
        if (currentOrder) return;
        for(let k in markers) markers[k].setMap(null); markers = {};
        snap.forEach(child => {
          const o = child.val();
          if(o.status === 'pending') {
            const m = new google.maps.Marker({ position: o.pickup, map: map, animation: google.maps.Animation.BOUNCE });
            const info = new google.maps.InfoWindow({ content: `<div class='p-2 text-end'><b>${o.customerName}</b><br><button class="btn-accept-map mt-2" onclick="acceptOrder('${o.id}')">قبول وتوصيل</button></div>` });
            m.addListener("click", () => info.open(map, m));
            markers[o.id] = m;
          }
        });
      });
    }

    function acceptOrder(id) {
      db.ref('orders/' + id).once('value').then(snap => {
        const oData = snap.val();
        currentOrder = oData;
        isAutoFollow = true; // تفعيل التتبع عند بدء الرحلة
        document.getElementById('recenterBtn').classList.add('active');
        
        db.ref('orders/' + id).update({ status: 'accepted', driver: driverName });
        for(let k in markers) markers[k].setMap(null);
        document.getElementById('logTxt').innerHTML = `<span class="text-success">✔ تم القبول</span> اتجه لموقع الزبون`;
        document.getElementById('tripControls').style.display = 'block';
        
        const phone = oData.customerPhone || "";
        document.getElementById('tripControls').innerHTML = `
          <div class="trip-actions">
            <a href="tel:${phone}" class="btn-action btn-call text-center text-decoration-none"><i class="fas fa-phone-alt me-2"></i>اتصال</a>
            <button class="btn-action btn-cancel" onclick="cancelTrip()"><i class="fas fa-times me-2"></i>إلغاء</button>
            <button class="btn-action btn-start" onclick="startTrip()">وصلت للزبون 🚀</button>
          </div>`;
        document.getElementById('chatBtn').style.display = 'flex';
        initChat(id);
        calcRoute({ lat: parseFloat(localStorage.getItem('carwa_driver_lat')), lng: parseFloat(localStorage.getItem('carwa_driver_lng')) }, oData.pickup);
      });
    }

    function startTrip() {
      if(!currentOrder) return;
      db.ref('orders/' + currentOrder.id).update({ status: 'in_progress' });
      document.getElementById('logTxt').innerHTML = `جاري التوجه للوجهة النهائية...`;
      document.getElementById('tripControls').innerHTML = `<button class="btn-action btn-finish" onclick="finishTrip()">إنهاء المشوار ✅</button>`;
      calcRoute({ lat: parseFloat(localStorage.getItem('carwa_driver_lat')), lng: parseFloat(localStorage.getItem('carwa_driver_lng')) }, currentOrder.dest, true);
    }

    function calcRoute(start, end, saveStats = false) {
      directionsService.route({ origin: start, destination: end, travelMode: google.maps.TravelMode.DRIVING }, (res, status) => {
        if (status === 'OK') {
          solidRenderer.setDirections(res);
          if (saveStats && res.routes[0].legs[0]) {
            const leg = res.routes[0].legs[0];
            tripStats = { distance: leg.distance.text, distanceVal: leg.distance.value };
          }
        }
      });
    }

    function finishTrip() {
      const price = 500 + (tripStats.distanceVal / 1000 * 1000);
      document.getElementById('statDist').innerText = tripStats.distance;
      document.getElementById('statPrice').innerText = Math.round(price).toLocaleString() + " د.ع";
      document.getElementById('statsOverlay').style.display = 'flex';
      db.ref('orders/' + currentOrder.id).update({ status: 'completed', cost: price });
    }

    function cancelTrip() {
      if(confirm("إلغاء الرحلة؟")) {
        db.ref('orders/' + currentOrder.id).update({ status: 'cancelled' });
        location.reload();
      }
    }

    function initChat(id) {
      db.ref('chats/' + id).on('child_added', snap => {
        const m = snap.val();
        const div = document.createElement('div');
        div.className = `msg ${m.sender === 'driver' ? 'me' : 'other'}`;
        div.innerText = m.text;
        document.getElementById('chatMsgs').appendChild(div);
        document.getElementById('chatMsgs').scrollTop = document.getElementById('chatMsgs').scrollHeight;
      });
    }

    function sendMsg() {
      const txt = document.getElementById('chatInput').value.trim();
      if(!txt || !currentOrder) return;
      db.ref('chats/' + currentOrder.id).push({ sender: 'driver', text: txt, time: Date.now() });
      document.getElementById('chatInput').value = "";
    }

    function toggleChat() {
      const win = document.getElementById('chatWindow');
      win.style.display = (win.style.display === 'flex') ? 'none' : 'flex';
    }

    function checkSubscription() {
      if(!driverPhone) return;
      db.ref('users/drivers/' + driverPhone).once('value', snap => {
        const u = snap.val();
        if(u && (new Date() > new Date(u.subscriptionExpiry) || u.isLocked)) {
          document.getElementById('subBlocker').style.display = 'flex';
        } else {
          initMap();
        }
      });
    }

    function redeemPin() {
      const pin = document.getElementById('pinInput').value;
      db.ref('pins/' + pin).once('value', snap => {
        if(snap.exists()) {
          const newExp = new Date(); newExp.setDate(newExp.getDate() + 30);
          db.ref('users/drivers/' + driverPhone).update({ subscriptionExpiry: newExp.toISOString(), isLocked: false });
          db.ref('pins/' + pin).remove();
          location.reload();
        } else alert("الكود خطأ!");
      });
    }

    function logout() { localStorage.clear(); window.location.href = "index.html"; }

    checkSubscription();
  </script>
</body>
</html>
