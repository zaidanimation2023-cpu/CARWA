<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>كروة - الزبون</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #FF6F00;
      --dark: #2D3436;
      --light: #F9F9F9;
      --shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    body, html { 
      height: 100%; margin: 0; padding: 0; 
      font-family: 'Cairo', sans-serif; overflow: hidden; background: white; 
    }

    #map { height: 100vh; width: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
    
    /* زر الخروج */
    .logout-btn {
      position: absolute; top: 40px; left: 20px; z-index: 10;
      background: white; border: none; width: 45px; height: 45px;
      border-radius: 50%; box-shadow: var(--shadow);
      color: #dc3545; transition: 0.2s; display: flex; align-items: center; justify-content: center;
    }
    .logout-btn:active { transform: scale(0.9); }

    /* القائمة السفلية */
    .bottom-sheet { 
      position: fixed; bottom: 0; left: 0; right: 0; 
      background: white; padding: 25px; 
      border-radius: 30px 30px 0 0; 
      box-shadow: 0 -5px 40px rgba(0,0,0,0.15); 
      z-index: 100; max-width: 600px; margin: 0 auto;
      transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); 
      animation: slideUp 0.4s ease-out;
      max-height: 60vh; overflow-y: auto; /* للسماح بالتمرير في الدردشة */
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    h5 { font-weight: 800; color: var(--dark); margin-bottom: 20px; letter-spacing: -0.5px; }
    
    .search-input { 
      border-radius: 16px; padding: 15px 20px; border: 2px solid #f0f0f0; 
      background: #fdfdfd; font-weight: 600; font-size: 1rem;
      box-shadow: none !important; transition: 0.3s;
    }
    .search-input:focus { border-color: var(--primary); background: white; }

    .btn-confirm { 
      border-radius: 16px; padding: 16px; font-weight: 800; 
      background-color: var(--dark); color: white; border: none; width: 100%; 
      font-size: 1.1rem; margin-top: 15px; display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .btn-request { background-color: var(--primary); box-shadow: 0 8px 20px rgba(255, 111, 0, 0.3); } 

    .status-badge { 
      background: #FFF3E0; color: var(--primary); 
      padding: 8px 15px; border-radius: 20px; 
      font-size: 0.9rem; font-weight: 700; display: inline-block; margin-bottom: 10px;
    }

    /* --- تصميم الدردشة (جديد) --- */
    .chat-box { 
      margin-top: 15px; background: #f8f9fa; border-radius: 20px; 
      padding: 15px; border: 1px solid #eee; display: flex; flex-direction: column; gap: 10px;
    }
    .chat-msgs { 
      height: 150px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; 
      padding-right: 5px;
    }
    .msg { padding: 8px 12px; border-radius: 15px; font-size: 0.9rem; max-width: 80%; word-wrap: break-word; }
    /* رسائل الزبون (يمين - برتقالي) */
    .msg.me { background: var(--primary); color: white; align-self: flex-start; border-bottom-right-radius: 2px; }
    /* رسائل السائق (يسار - رمادي) */
    .msg.other { background: #e9ecef; color: #333; align-self: flex-end; border-bottom-left-radius: 2px; }
    
    .chat-input-area { display: flex; gap: 8px; }
    .chat-input { flex: 1; border: 1px solid #ddd; border-radius: 25px; padding: 10px 15px; font-size: 0.9rem; outline: none; }
    .btn-send { background: var(--dark); color: white; border: none; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
    .btn-send:active { transform: scale(0.9); }

    /* الفاتورة */
    .stats-overlay { 
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
      background: rgba(255,255,255,0.85); backdrop-filter: blur(8px); z-index: 200; 
      display: none; justify-content: center; align-items: center; 
    }
    .stats-card { 
      background: white; width: 85%; max-width: 360px; 
      border-radius: 30px; padding: 40px 30px; text-align: center; 
      box-shadow: 0 20px 60px rgba(0,0,0,0.1); border: 1px solid #eee;
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .stat-row { display: flex; justify-content: space-between; margin: 12px 0; padding: 12px 15px; background: #fafafa; border-radius: 12px; }
    .stat-val { font-weight: 800; color: var(--dark); }
    .price-display { font-size: 2.2rem; color: var(--primary); font-weight: 900; margin: 15px 0; letter-spacing: -1px; }
  </style>
</head>
<body>

  <div id="map"></div>

  <audio id="arriveSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

  <button class="logout-btn" onclick="logout()">
    <i class="fas fa-sign-out-alt"></i>
  </button>

  <div class="bottom-sheet" id="ui-container"></div>

  <div class="stats-overlay" id="statsOverlay">
    <div class="stats-card">
      <div style="font-size: 3.5rem; margin-bottom: 10px;">🚕</div>
      <h3 class="fw-bold mb-1">وصلت بالسلامة!</h3>
      <p class="text-muted small mb-4">شكراً لاختيارك كروة</p>
      <div class="stat-row">
        <span class="stat-label"><i class="fas fa-route"></i> المسافة</span>
        <span class="stat-val" id="statDist">--</span>
      </div>
      <div class="stat-row">
        <span class="stat-label"><i class="fas fa-stopwatch"></i> الوقت</span>
        <span class="stat-val" id="statTime">--</span>
      </div>
      <div class="mt-3">
        <small class="text-muted fw-bold">المبلغ المطلوب</small>
        <div class="price-display" id="statPrice">--</div>
      </div>
      <button class="btn btn-dark w-100 mt-3 py-3 rounded-4 fw-bold" onclick="closeStatsAndReset()">تم، أغلق</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDkosn3orZqLf5Dd7g32TGUarW5a3MF2Oc",
      databaseURL: "https://carwa-zaid-default-rtdb.firebaseio.com",
      projectId: "carwa-zaid"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let map, marker, driverMarker, directionsService, dashedRenderer, solidRenderer;
    let currentStep = 'pickup', pickupPos, destPos, activeOrderId = null;
    const customerName = localStorage.getItem('carwa_user_name') || "يا هلا";
    const customerPhone = localStorage.getItem('carwa_user_phone') || "";
    const sound = document.getElementById('arriveSound');

    const silverMapStyle = [
      { "elementType": "geometry", "stylers": [{ "color": "#f5f5f5" }] },
      { "elementType": "labels.icon", "stylers": [{ "visibility": "off" }] },
      { "elementType": "labels.text.fill", "stylers": [{ "color": "#616161" }] },
      { "elementType": "labels.text.stroke", "stylers": [{ "color": "#f5f5f5" }] },
      { "featureType": "road", "elementType": "geometry", "stylers": [{ "color": "#ffffff" }] },
      { "featureType": "road", "elementType": "labels.text.fill", "stylers": [{ "color": "#000000" }] },
      { "featureType": "water", "elementType": "geometry", "stylers": [{ "color": "#e9e9e9" }] }
    ];

   function logout() {
  if(confirm("خروج؟")) {
    localStorage.removeItem('carwa_user_type');
    localStorage.removeItem('carwa_user_name');
    localStorage.removeItem('carwa_user_phone');
    // لا تحذف carwa_device_id أبداً!
    window.location.href = "index.html";
  }
}

    function initMap() {
      const defaultPos = { lat: 24.7136, lng: 46.6753 };
      map = new google.maps.Map(document.getElementById("map"), { 
        center: defaultPos, zoom: 16, disableDefaultUI: true, styles: silverMapStyle 
      });
      marker = new google.maps.Marker({ map: map, position: defaultPos, draggable: true });
      directionsService = new google.maps.DirectionsService();

      solidRenderer = new google.maps.DirectionsRenderer({ map: map, suppressMarkers: false, polylineOptions: { strokeColor: "#FF6F00", strokeWeight: 6, strokeOpacity: 1.0 } });
      dashedRenderer = new google.maps.DirectionsRenderer({ map: map, suppressMarkers: false, polylineOptions: { strokeOpacity: 0, icons: [{ icon: { path: 'M 0,-1 0,1', strokeOpacity: 1, scale: 3 }, offset: '0', repeat: '20px' }], strokeColor: "#666", strokeWeight: 2 } });

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          const p = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          map.setCenter(p); marker.setPosition(p); pickupPos = p;
        }, () => pickupPos = defaultPos);
      } else pickupPos = defaultPos;
      renderUI();
    }

    function renderUI(statusText="") {
      const container = document.getElementById('ui-container');
      
      if (currentStep === 'pickup') {
        container.innerHTML = `
          <h5><i class="fas fa-map-marker-alt text-warning me-2"></i> أهلاً ${customerName}، أين موقعك؟</h5>
          <input id="pac-input" class="form-control search-input" placeholder="ابحث عن مكان الانطلاق...">
          <button class="btn btn-confirm" onclick="confirmPickup()">تأكيد الانطلاق <i class="fas fa-arrow-left"></i></button>`;
        activateSearch();
      } else if (currentStep === 'dropoff') {
        container.innerHTML = `
          <h5><i class="fas fa-flag-checkered text-success me-2"></i> إلى أين تريد الذهاب؟</h5>
          <input id="pac-input" class="form-control search-input" placeholder="ابحث عن وجهتك...">
          <button class="btn btn-confirm" onclick="confirmDestination()">تأكيد الوجهة <i class="fas fa-route"></i></button>`;
        activateSearch();
      } else if (currentStep === 'confirm') {
        container.innerHTML = `
          <h5><i class="fas fa-list me-2"></i> ملخص الرحلة</h5>
          <div class="alert alert-light border rounded-3 text-muted"><i class="fas fa-info-circle me-1"></i> تم رسم المسار. اضغط للطلب.</div>
          <button class="btn btn-confirm btn-request" onclick="sendOrder()">اطلب كروة الآن <i class="fas fa-paper-plane"></i></button>`;
      } else if (currentStep === 'waiting') {
        container.innerHTML = `
          <div class="text-center py-4">
            <div class="spinner-border text-warning mb-3" role="status"></div>
            <h5>جاري البحث عن كابتن...</h5>
            <p class="text-muted small">نبحث لك عن أقرب سيارة في المنطقة</p>
          </div>`;
      } else if (currentStep === 'tracking') {
        // تمت إضافة واجهة الدردشة هنا
        container.innerHTML = `
          <div class="text-center">
            <span class="status-badge"><i class="fas fa-taxi me-1"></i> ${statusText}</span>
            <h5 class="mt-2 mb-0">الكابتن قادم إليك!</h5>
          </div>
          
          <div class="chat-box">
            <small class="text-muted fw-bold">💬 تواصل مع السائق</small>
            <div id="chatMsgs" class="chat-msgs"></div>
            <div class="chat-input-area">
              <input type="text" id="chatInput" class="chat-input" placeholder="اكتب رسالة...">
              <button class="btn-send" onclick="sendMsg()"><i class="fas fa-paper-plane"></i></button>
            </div>
          </div>`;
          
          if(activeOrderId) initChat(activeOrderId);
      }
    }

    function activateSearch() {
      setTimeout(() => {
        const input = document.getElementById("pac-input");
        if(input && google.maps.places) {
          const autocomplete = new google.maps.places.Autocomplete(input);
          autocomplete.bindTo("bounds", map);
          autocomplete.addListener("place_changed", function() {
            const place = this.getPlace();
            if(place.geometry) { 
              if(place.geometry.viewport) map.fitBounds(place.geometry.viewport);
              else { map.setCenter(place.geometry.location); map.setZoom(17); }
              marker.setPosition(place.geometry.location); 
            }
          });
        }
      }, 500);
    }

    function confirmPickup() { pickupPos = { lat: marker.getPosition().lat(), lng: marker.getPosition().lng() }; currentStep = 'dropoff'; marker.setPosition(map.getCenter()); renderUI(); }
    function confirmDestination() { destPos = { lat: marker.getPosition().lat(), lng: marker.getPosition().lng() }; currentStep = 'confirm'; marker.setVisible(false); renderUI(); drawDashedRoute(pickupPos, destPos); }
    function drawDashedRoute(start, end) { directionsService.route({ origin: start, destination: end, travelMode: google.maps.TravelMode.DRIVING }, (res, status) => { if(status === 'OK') dashedRenderer.setDirections(res); }); }
    function drawSolidRoute(start, end) { directionsService.route({ origin: start, destination: end, travelMode: google.maps.TravelMode.DRIVING }, (res, status) => { if(status === 'OK') solidRenderer.setDirections(res); }); }
    
    function sendOrder() {
      const oId = "ID_" + Date.now();
      activeOrderId = oId;
      db.ref('orders/' + oId).set({ 
        id: oId, pickup: pickupPos, dest: destPos, car: "Standard", status: 'pending', timestamp: firebase.database.ServerValue.TIMESTAMP,
        customerName: customerName, customerPhone: customerPhone 
      }).then(() => { currentStep = 'waiting'; renderUI(); trackOrder(oId); });
    }

    function trackOrder(orderId) {
      const orderRef = db.ref('orders/' + orderId);
      let acceptedAlert = false; // لمنع تكرار الصوت

      orderRef.on('value', snapshot => {
        const data = snapshot.val();
        if (!data) return;

        // عند قبول الطلب
        if (data.status === 'accepted' && data.driver_location) {
          currentStep = 'tracking'; 
          renderUI("تم قبول الطلب");
          
          // تشغيل الصوت مرة واحدة عند القبول
          if(!acceptedAlert) {
            sound.play().catch(e => console.log("الصوت يحتاج تفاعل"));
            acceptedAlert = true;
          }

          const dPos = { lat: data.driver_location.lat, lng: data.driver_location.lng };
          if (!driverMarker) driverMarker = new google.maps.Marker({ position: dPos, map: map, icon: 'https://maps.google.com/mapfiles/kml/shapes/cabs.png' });
          else driverMarker.setPosition(dPos);
          drawSolidRoute(dPos, pickupPos);
        }

        if (data.status === 'in_progress' || data.status === 'picked_up') {
          renderUI("الرحلة جارية..."); dashedRenderer.setMap(null);
          const cPos = data.driver_location ? { lat: data.driver_location.lat, lng: data.driver_location.lng } : pickupPos;
          if (driverMarker) driverMarker.setPosition(cPos);
          drawSolidRoute(cPos, destPos);
        }

        if (data.status === 'completed') { showTripSummary(); orderRef.off(); }
      });
    }

    // --- منطق الدردشة ---
    function initChat(orderId) {
      const chatRef = db.ref('chats/' + orderId);
      const msgsDiv = document.getElementById('chatMsgs');
      if(!msgsDiv) return;
      msgsDiv.innerHTML = ""; // تنظيف

      chatRef.on('child_added', snap => {
        const msg = snap.val();
        const div = document.createElement('div');
        // الزبون = "me" (يمين)، السائق = "other" (يسار)
        div.className = `msg ${msg.sender === 'customer' ? 'me' : 'other'}`;
        div.innerText = msg.text;
        msgsDiv.appendChild(div);
        msgsDiv.scrollTop = msgsDiv.scrollHeight;
      });
    }

    function sendMsg() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if(!text || !activeOrderId) return;
      
      db.ref('chats/' + activeOrderId).push({
        sender: 'customer',
        text: text,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      });
      input.value = "";
    }

    function showTripSummary() {
      document.getElementById('ui-container').style.display = 'none';
      if(solidRenderer) solidRenderer.setMap(null); if(dashedRenderer) dashedRenderer.setMap(null); if(driverMarker) driverMarker.setMap(null);
      
      const finalPos = destPos || map.getCenter(); map.setCenter(finalPos); map.setZoom(16);
      new google.maps.Marker({ position: finalPos, map: map });
      
      directionsService.route({ origin: pickupPos, destination: destPos, travelMode: google.maps.TravelMode.DRIVING }, (res, status) => {
        if (status === 'OK' && res.routes[0].legs[0]) {
          const leg = res.routes[0].legs[0];
          document.getElementById('statDist').innerText = leg.distance.text;
          document.getElementById('statTime').innerText = leg.duration.text;
          const price = 500 + (leg.distance.value / 1000 * 1000);
          document.getElementById('statPrice').innerText = Math.round(price).toLocaleString() + " د.ع";
        }
      });
      document.getElementById('statsOverlay').style.display = 'flex';
    }

    function closeStatsAndReset() { location.reload(); }
  </script>
  <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDVsOdieu4zCgOa9ZBASM05vX-DLeTmkc8&libraries=places&language=ar&callback=initMap"></script>
</body>
</html>
