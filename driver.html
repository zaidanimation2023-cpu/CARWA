<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>كروة - الكابتن</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root { --primary: #FF6F00; --dark: #2D3436; --shadow: 0 4px 20px rgba(0,0,0,0.15); }
    body, html { height: 100%; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; overflow: hidden; background: white; }
    #map { height: 100vh; width: 100%; position: absolute; top:0; left:0; z-index: 1; }
    
    .ui-top { position: relative; z-index: 10; padding: 20px; pointer-events: none; }
    .panel-info { 
      background: rgba(255,255,255,0.95); backdrop-filter: blur(10px);
      padding: 15px 20px; border-radius: 20px; pointer-events: auto; 
      max-width: 400px; box-shadow: var(--shadow); margin: 0 auto; 
    }
    h6 { font-weight: 800; color: var(--primary); margin: 0; font-size: 1rem; }
    .btn-logout { border: 1px solid #fee; color: #dc3545; background: white; border-radius: 15px; font-size: 0.8rem; font-weight: 700; padding: 4px 12px; }
    #statusPanel { margin-top: 10px; padding-top: 10px; border-top: 1px solid #eee; font-size: 0.9rem; font-weight: 600; color: #555; }
    .btn-action { width: 100%; margin-top: 10px; font-weight: 800; border-radius: 12px; padding: 12px; font-size: 1rem; border: none; box-shadow: var(--shadow); }
    .btn-start { background: var(--primary); color: white; }
    .btn-finish { background: #2ecc71; color: white; }
    .btn-accept-map { background: var(--primary); color: white; border: none; font-weight: 700; width: 100%; border-radius: 8px; margin-top: 5px; padding: 6px; font-size: 0.9rem; }

    /* --- شاشة قفل الاشتراك --- */
    .subscription-blocker {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: white; z-index: 9999; display: none; /* مخفي افتراضياً */
      flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 30px;
    }
    .sub-icon { font-size: 4rem; color: #dc3545; margin-bottom: 20px; }
    .sub-input { 
      text-align: center; font-size: 1.5rem; letter-spacing: 5px; 
      border: 2px solid #eee; border-radius: 15px; padding: 15px; 
      width: 100%; max-width: 300px; margin: 20px 0; outline: none;
    }
    .sub-input:focus { border-color: var(--primary); }
    .btn-unlock { background: var(--dark); color: white; width: 100%; max-width: 300px; padding: 15px; border-radius: 15px; font-weight: bold; border: none; }

    /* الدردشة */
    .chat-float-btn { position: fixed; bottom: 30px; left: 20px; z-index: 90; width: 55px; height: 55px; border-radius: 50%; background: var(--dark); color: white; border: none; box-shadow: 0 5px 20px rgba(0,0,0,0.3); display: none; align-items: center; justify-content: center; font-size: 1.4rem; transition: transform 0.2s; }
    .badge-dot { position: absolute; top: 12px; right: 12px; width: 12px; height: 12px; background: red; border-radius: 50%; border: 2px solid var(--dark); display: none; }
    .chat-popup { position: fixed; bottom: 95px; left: 20px; width: 320px; max-width: 90vw; background: white; border-radius: 20px; z-index: 100; box-shadow: 0 10px 40px rgba(0,0,0,0.25); display: none; flex-direction: column; overflow: hidden; border: 1px solid #eee; }
    .chat-header { background: var(--dark); color: white; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 0.95rem; }
    .chat-close { background: none; border: none; color: white; font-size: 1.1rem; cursor: pointer; padding: 0 5px; }
    .chat-msgs { height: 250px; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: #f8f9fa; }
    .msg { padding: 8px 14px; border-radius: 12px; font-size: 0.9rem; max-width: 80%; word-wrap: break-word; line-height: 1.4; }
    .msg.me { background: var(--primary); color: white; align-self: flex-start; border-bottom-right-radius: 2px; }
    .msg.other { background: #e9ecef; color: #333; align-self: flex-end; border-bottom-left-radius: 2px; }
    .chat-footer { padding: 10px; display: flex; gap: 8px; background: white; border-top: 1px solid #eee; align-items: center; }
    .chat-input { flex: 1; border: 1px solid #ddd; border-radius: 25px; padding: 10px 15px; font-size: 0.9rem; outline: none; background: #fdfdfd; }
    .btn-send { background: var(--primary); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

    /* الفاتورة */
    .stats-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.9); backdrop-filter: blur(5px); z-index: 200; display: none; justify-content: center; align-items: center; }
    .stats-card { background: white; width: 85%; max-width: 350px; border-radius: 25px; padding: 30px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.15); }
    .price-display { font-size: 2.2rem; color: var(--primary); font-weight: 900; margin: 15px 0; }
  </style>
</head>
<body>

  <div id="subBlocker" class="subscription-blocker">
    <i class="fas fa-user-lock sub-icon"></i>
    <h3 class="fw-bold mb-2">عفواً، انتهى الاشتراك</h3>
    <p class="text-muted mb-4">يرجى التواصل مع إدارة كروة للحصول على كود التفعيل (PIN).</p>
    <input type="number" id="pinInput" class="sub-input" placeholder="000000">
    <button class="btn-unlock" onclick="redeemPin()">تفعيل الحساب</button>
    <button onclick="logout()" class="btn btn-link text-muted mt-3">تسجيل خروج</button>
  </div>

  <div id="map"></div>
  <audio id="orderSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>
  <audio id="msgSound" src="https://assets.mixkit.co/active_storage/sfx/2345/2345-preview.mp3"></audio>

  <div class="ui-top">
    <div class="panel-info" id="mainPanel">
      <div class="d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
          <i class="fas fa-taxi text-warning"></i>
          <h6 id="driverTitle">كابتن</h6>
        </div>
        <button onclick="logout()" class="btn-logout">خروج</button>
      </div>
      <div id="statusPanel">
        <div class="d-flex align-items-center gap-2">
          <div class="spinner-grow spinner-grow-sm text-warning" role="status"></div>
          <span id="logTxt">في انتظار الطلبات...</span>
        </div>
      </div>
      <div id="tripControls" style="display:none;"></div>
    </div>
  </div>

  <button id="chatBtn" class="chat-float-btn" onclick="toggleChat()"><i class="fas fa-comment-alt"></i><span id="chatBadge" class="badge-dot"></span></button>
  <div id="chatWindow" class="chat-popup">
    <div class="chat-header"><span><i class="fas fa-user-circle me-2"></i>الزبون</span><button class="chat-close" onclick="toggleChat()"><i class="fas fa-times"></i></button></div>
    <div class="chat-msgs" id="chatMsgs"></div>
    <div class="chat-footer"><input type="text" id="chatInput" class="chat-input" placeholder="اكتب رسالة..." onkeydown="handleEnter(event)"><button class="btn-send" onclick="sendMsg()"><i class="fas fa-paper-plane"></i></button></div>
  </div>

  <div class="stats-overlay" id="statsOverlay">
    <div class="stats-card">
      <h3 class="fw-bold mb-4">إنهاء الرحلة</h3>
      <div class="d-flex justify-content-between mb-2"><span class="text-muted">المسافة</span><span class="fw-bold" id="statDist">--</span></div>
      <div class="d-flex justify-content-between"><span class="text-muted">الوقت</span><span class="fw-bold" id="statTime">--</span></div>
      <div class="mt-3"><small class="text-muted fw-bold">المبلغ المستحق</small><div class="price-display" id="statPrice">--</div></div>
      <button class="btn btn-dark w-100 mt-3 py-3 rounded-4 fw-bold" onclick="closeStatsAndReset()">تم</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDVsOdieu4zCgOa9ZBASM05vX-DLeTmkc8&language=ar"></script>

  <script>
    const firebaseConfig = { apiKey: "AIzaSyDkosn3orZqLf5Dd7g32TGUarW5a3MF2Oc", databaseURL: "https://carwa-zaid-default-rtdb.firebaseio.com", projectId: "carwa-zaid" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let map, markers = {}, directionsService, solidRenderer, dashedRenderer;
    let currentOrder = null, tripStats = { distance: '', duration: '' };
    const driverName = localStorage.getItem('carwa_driver_name') || "كابتن";
    const driverPhone = localStorage.getItem('carwa_driver_phone');
    document.getElementById('driverTitle').innerText = driverName;
    const orderSound = document.getElementById('orderSound');
    const msgSound = document.getElementById('msgSound');

    // التحقق من الاشتراك (Subscription Check)
    function checkSubscription() {
      if(!driverPhone) return;
      db.ref('users/drivers/' + driverPhone).once('value', snap => {
        const user = snap.val();
        if(user) {
          const expiryDate = new Date(user.subscriptionExpiry || 0); // إذا لم يوجد تاريخ، يعتبر منتهي
          const now = new Date();
          
          if(now > expiryDate || user.isLocked === true) {
            // انتهى الاشتراك أو الحساب مقفل
            document.getElementById('subBlocker').style.display = 'flex';
          } else {
            // الاشتراك ساري
            document.getElementById('subBlocker').style.display = 'none';
            initMap(); // تحميل الخريطة فقط إذا الحساب فعال
          }
        }
      });
    }

    // تفعيل الحساب بكود PIN
    function redeemPin() {
      const pin = document.getElementById('pinInput').value.trim();
      if(!pin) return alert("الرجاء إدخال الكود");

      db.ref('pins/' + pin).once('value', snap => {
        if(snap.exists()) {
          // الكود صحيح
          const pinData = snap.val();
          const newExpiry = new Date();
          newExpiry.setDate(newExpiry.getDate() + 30); // تمديد 30 يوم (افتراضي للـ PIN)

          db.ref('users/drivers/' + driverPhone).update({
            subscriptionExpiry: newExpiry.toISOString(),
            isLocked: false
          }).then(() => {
            alert("تم تفعيل الاشتراك بنجاح!");
            db.ref('pins/' + pin).remove(); // حذف الكود بعد الاستخدام
            location.reload();
          });
        } else {
          alert("الكود غير صحيح أو منتهي الصلاحية");
        }
      });
    }

    const silverMapStyle = [ { "elementType": "geometry", "stylers": [{ "color": "#f5f5f5" }] }, { "elementType": "labels.icon", "stylers": [{ "visibility": "off" }] }, { "elementType": "labels.text.fill", "stylers": [{ "color": "#616161" }] }, { "featureType": "road", "elementType": "geometry", "stylers": [{ "color": "#ffffff" }] } ];

    function logout() {
  if(confirm("خروج؟")) {
    // نحذف بيانات الجلسة فقط، ونبقي على carwa_device_id
    localStorage.removeItem('carwa_user_type');
    localStorage.removeItem('carwa_driver_name');
    localStorage.removeItem('carwa_driver_phone');
    // لا تحذف carwa_device_id أبداً!
    window.location.href = "index.html";
  }
}

    function initMap() {
      map = new google.maps.Map(document.getElementById("map"), { center: { lat: 24.7136, lng: 46.6753 }, zoom: 13, disableDefaultUI: true, styles: silverMapStyle });
      directionsService = new google.maps.DirectionsService();
      solidRenderer = new google.maps.DirectionsRenderer({ map: map, suppressMarkers: false, polylineOptions: { strokeColor: "#FF6F00", strokeWeight: 6 } });
      dashedRenderer = new google.maps.DirectionsRenderer({ map: map, suppressMarkers: false, polylineOptions: { strokeOpacity: 0, icons: [{ icon: { path: 'M 0,-1 0,1', strokeOpacity: 1, scale: 4 }, offset: '0', repeat: '20px' }], strokeColor: "#666", strokeWeight: 2 } });
      listenForOrders();
    }

    function listenForOrders() {
      let ordersFound = false;
      db.ref('orders').on('value', snap => {
        if (currentOrder) return;
        for(let k in markers) { markers[k].setMap(null); } markers = {};
        const bounds = new google.maps.LatLngBounds(); let hasOrders = false;
        snap.forEach(child => {
          const o = child.val();
          if(o.status === 'pending' && o.pickup) {
            const pos = { lat: o.pickup.lat, lng: o.pickup.lng };
            const m = new google.maps.Marker({ position: pos, map: map, icon: 'http://maps.google.com/mapfiles/ms/icons/green-dot.png', animation: google.maps.Animation.DROP });
            const info = new google.maps.InfoWindow({ content: `<div class='p-2 text-end'><div class="fw-bold mb-2">${o.customerName || "زبون"}</div><button class="btn-accept-map" onclick="acceptOrder('${o.id}')">قبول الطلب</button></div>` });
            m.addListener("click", () => info.open(map, m));
            markers[o.id] = m; bounds.extend(pos); hasOrders = true;
          }
        });
        if (hasOrders) { map.fitBounds(bounds); document.getElementById('logTxt').innerText = "يوجد طلبات متاحة!"; if(!ordersFound) { orderSound.play().catch(()=>{}); ordersFound = true; } } 
        else { document.getElementById('logTxt').innerText = "في انتظار الطلبات..."; ordersFound = false; }
      });
    }

    function acceptOrder(id) {
      db.ref('orders/' + id).once('value').then(snap => {
        const oData = snap.val(); if(!oData) { alert("راح الطلب"); return; }
        db.ref('orders/' + id).update({ status: 'accepted', driver: driverName });
        currentOrder = oData; for(let k in markers) markers[k].setMap(null); markers = {};
        document.getElementById('logTxt').innerHTML = `<span class="text-success">✔ تم القبول</span> اتجه للزبون`;
        document.getElementById('tripControls').style.display = 'block';
        document.getElementById('tripControls').innerHTML = `<button class="btn-action btn-start" onclick="startTrip()">وصلت للعميل 🚀</button>`;
        document.getElementById('chatBtn').style.display = 'flex';
        initChat(id);
        startGps(id);
        if (navigator.geolocation) { navigator.geolocation.getCurrentPosition(pos => { const driverPos = { lat: pos.coords.latitude, lng: pos.coords.longitude }; calcRoute(driverPos, oData.pickup, solidRenderer, false); calcRoute(oData.pickup, oData.dest, dashedRenderer, false); }); }
      });
    }

    function toggleChat() { const chatWin = document.getElementById('chatWindow'); const badge = document.getElementById('chatBadge'); if (chatWin.style.display === 'flex') { chatWin.style.display = 'none'; } else { chatWin.style.display = 'flex'; badge.style.display = 'none'; document.getElementById('chatMsgs').scrollTop = document.getElementById('chatMsgs').scrollHeight; } }
    function initChat(orderId) { const chatRef = db.ref('chats/' + orderId); const msgsDiv = document.getElementById('chatMsgs'); msgsDiv.innerHTML = ""; chatRef.on('child_added', snap => { const msg = snap.val(); const div = document.createElement('div'); div.className = `msg ${msg.sender === 'driver' ? 'me' : 'other'}`; div.innerText = msg.text; msgsDiv.appendChild(div); msgsDiv.scrollTop = msgsDiv.scrollHeight; if(msg.sender !== 'driver') { msgSound.play().catch(()=>{}); if(document.getElementById('chatWindow').style.display === 'none') { document.getElementById('chatBadge').style.display = 'block'; } } }); }
    function sendMsg() { const input = document.getElementById('chatInput'); const text = input.value.trim(); if(!text || !currentOrder) return; db.ref('chats/' + currentOrder.id).push({ sender: 'driver', text: text, timestamp: firebase.database.ServerValue.TIMESTAMP }); input.value = ""; }
    function handleEnter(e) { if(e.key === 'Enter') sendMsg(); }
    function startTrip() { if(!currentOrder) return; db.ref('orders/' + currentOrder.id).update({ status: 'in_progress' }); document.getElementById('logTxt').innerHTML = `الرحلة جارية...`; document.getElementById('tripControls').innerHTML = `<button class="btn-action btn-finish" onclick="finishTrip()">إنهاء الرحلة ✅</button>`; dashedRenderer.setMap(null); if (navigator.geolocation) { navigator.geolocation.getCurrentPosition(pos => { calcRoute({ lat: pos.coords.latitude, lng: pos.coords.longitude }, currentOrder.dest, solidRenderer, true); }); } }
    function finishTrip() { solidRenderer.setMap(null); dashedRenderer.setMap(null); document.getElementById('mainPanel').style.display = 'none'; document.getElementById('chatBtn').style.display = 'none'; document.getElementById('chatWindow').style.display = 'none'; document.getElementById('statDist').innerText = tripStats.distance || "--"; document.getElementById('statTime').innerText = tripStats.duration || "--"; let price = 0; if(tripStats.distanceVal) price = 500 + (tripStats.distanceVal / 1000 * 1000); document.getElementById('statPrice').innerText = Math.round(price).toLocaleString() + " د.ع"; document.getElementById('statsOverlay').style.display = 'flex'; if(currentOrder) { db.ref('orders/' + currentOrder.id).update({ status: 'completed', cost: price, distance: tripStats.distance }); db.ref('history').push({ date: new Date().toISOString(), orderId: currentOrder.id, driver: driverName, customer: currentOrder.customerName, cost: price, distance: tripStats.distance }); } }
    function closeStatsAndReset() { location.reload(); } 
    function calcRoute(start, end, renderer, saveStats) { directionsService.route({ origin: start, destination: end, travelMode: google.maps.TravelMode.DRIVING }, (res, status) => { if (status === 'OK') { renderer.setDirections(res); if(saveStats && res.routes[0].legs[0]) { const leg = res.routes[0].legs[0]; tripStats = { distance: leg.distance.text, distanceVal: leg.distance.value, duration: leg.duration.text }; } } }); }
    function startGps(orderId) { if (navigator.geolocation) { navigator.geolocation.watchPosition(pos => { if(currentOrder && currentOrder.status !== 'completed') { db.ref('orders/' + orderId + '/driver_location').set({ lat: pos.coords.latitude, lng: pos.coords.longitude }); } }, null, { enableHighAccuracy: true }); } }
    
    // تشغيل فحص الاشتراك عند التحميل
    checkSubscription();
  </script>
</body>
</html>
