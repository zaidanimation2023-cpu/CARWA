<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000">
  <title>كروة 2026 - كابتن</title>
  <link rel="preconnect" href="https://carwa-zaid-default-rtdb.firebaseio.com">
  <link rel="preconnect" href="https://maps.googleapis.com">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #FF6F00;
      --dark: #2D3436;
      --bg: #000;
      --text: #f0f0f0;
      --border: #1e1e1e;
      --panel-h: 50vh;
      --map-h: 50vh;
    }
    body.light {
      --bg: #f5f5f5; --text: #111;
      --border: #ddd;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body { height: 100%; width: 100%; overflow: hidden; font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); }

    /* ===================== LAYOUT ===================== */
    #app { display: flex; flex-direction: column; height: 100vh; width: 100%; }

    #map-section { position: relative; height: var(--map-h); flex-shrink: 0; background: #111; }
    #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

    .map-btn {
      position: absolute; z-index: 10; border: none; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: transform .15s; backdrop-filter: blur(8px);
    }
    .map-btn:active { transform: scale(0.88); }

    #themeBtn  { top: 10px; left: 10px;  width: 42px; height: 42px; background: rgba(0,0,0,0.75); border: 1px solid #333; color: var(--primary); font-size: 1rem; }
    #voiceBtn  { top: 60px; left: 10px;  width: 42px; height: 42px; background: rgba(0,0,0,0.75); border: 1px solid #333; color: var(--primary); font-size: 1rem; }
    #recenterBtn { bottom: 10px; right: 10px; width: 44px; height: 44px; background: rgba(0,0,0,0.75); border: 2px solid var(--primary); color: var(--primary); font-size: 1rem; }

    /* marker السائق */
    .driver-marker { width: 50px; height: 50px; border-radius: 50%; background: rgba(0,0,0,0.4); border: 2px solid var(--primary); display: flex; align-items: center; justify-content: center; }
    .driver-marker img { width: 40px; height: 40px; object-fit: contain; transform-origin: center; }

    .divider { height: 4px; background: linear-gradient(90deg, transparent, var(--primary), transparent); flex-shrink: 0; }

    /* ===== النصف السفلي ===== */
    #ui-section { flex: 1; height: var(--panel-h); background: var(--bg); display: flex; flex-direction: column; overflow: hidden; position: relative; }

    /* هيدر البانال */
    #panel-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px 8px; border-bottom: 1px solid var(--border); flex-shrink: 0; gap: 8px; }
    #driver-name-label { font-size: 0.92rem; font-weight: 800; color: var(--primary); }
    #status-text { font-size: 0.78rem; color: #777; font-weight: 600; }

    .header-btns { display: flex; gap: 6px; align-items: center; }
    .hdr-btn {
      width: 36px; height: 36px; border-radius: 50%; background: #111;
      border: 1px solid var(--border); color: var(--text); font-size: 0.88rem;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      position: relative; transition: .15s;
    }
    .hdr-btn:active { transform: scale(0.9); }
    .hdr-btn.danger { border-color: #c0392b; color: #c0392b; }
    .hdr-btn.has-badge::after { content:''; position:absolute; top:5px; right:5px; width:8px; height:8px; border-radius:50%; background:#ff5252; }

    /* المحتوى */
    #ui-container { flex: 1; overflow-y: auto; padding: 12px 14px; }
    #ui-container::-webkit-scrollbar { width: 3px; }
    #ui-container::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }

    /* ===================== COMPONENTS ===================== */
    .section-title { font-size: 0.9rem; font-weight: 800; color: var(--text); margin-bottom: 10px; }

    /* الطلبات الواردة */
    .order-card {
      background: #0f0f0f; border: 1px solid #2a2a2a; border-radius: 14px;
      padding: 13px; margin-bottom: 10px; animation: fadeIn .3s;
    }
    body.light .order-card { background: #fff; border-color: #e0e0e0; }
    @keyframes fadeIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }

    .order-card-title { font-weight: 800; font-size: 0.92rem; margin-bottom: 6px; }
    .order-meta { display: flex; gap: 10px; font-size: 0.8rem; color: #888; margin-bottom: 10px; }
    .order-stat { display: flex; align-items: center; gap: 4px; }
    .order-stat i { color: var(--primary); }
    .order-btns { display: flex; gap: 8px; }
    .btn-accept { flex: 2; background: var(--primary); color: #fff; border: none; border-radius: 10px; padding: 10px; font-family: 'Cairo', sans-serif; font-weight: 700; font-size: 0.88rem; cursor: pointer; min-height: 42px; transition: .15s; }
    .btn-reject { flex: 1; background: #1a1a1a; color: #888; border: 1px solid #333; border-radius: 10px; padding: 10px; font-family: 'Cairo', sans-serif; font-weight: 700; font-size: 0.88rem; cursor: pointer; min-height: 42px; transition: .15s; }
    .btn-accept:active { transform: scale(0.96); }
    .btn-reject:active { transform: scale(0.96); }

    /* حالة الانتظار */
    .idle-box { text-align: center; padding: 24px 10px; }
    .idle-box .pulse-ring {
      width: 52px; height: 52px; border-radius: 50%;
      border: 3px solid var(--primary); margin: 0 auto 14px;
      animation: pulse 1.5s ease-out infinite;
    }
    @keyframes pulse { 0% { transform: scale(0.9); opacity:.8; } 70% { transform: scale(1.2); opacity:0; } 100% { transform: scale(0.9); opacity:0; } }

    /* الرحلة النشطة */
    .trip-card { background: #0f0f0f; border: 1px solid #2a2a2a; border-radius: 14px; padding: 13px; margin-bottom: 10px; }
    body.light .trip-card { background: #fff; border-color: #e0e0e0; }
    .trip-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
    .trip-row:last-child { border-bottom: none; padding-bottom: 0; }
    .trip-label { color: #888; display: flex; align-items: center; gap: 6px; }
    .trip-label i { color: var(--primary); width: 16px; }
    .trip-val { font-weight: 800; font-size: 0.88rem; }

    .btn-full { width: 100%; padding: 12px; border-radius: 11px; border: none; font-family: 'Cairo', sans-serif; font-weight: 800; font-size: 0.9rem; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; margin-bottom: 8px; transition: .15s; }
    .btn-full:active { transform: scale(0.97); }
    .btn-orange  { background: var(--primary); box-shadow: 0 4px 14px rgba(255,111,0,.3); }
    .btn-green   { background: #27ae60; box-shadow: 0 4px 14px rgba(39,174,96,.3); }
    .btn-blue    { background: #2980b9; }
    .btn-red     { background: #c0392b; }
    .btn-gray    { background: #2c3e50; }
    .btn-2col    { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }

    /* ===================== PANELS: CHAT & ORDERS ===================== */
    .side-panel {
      display: none; flex-direction: column;
      position: absolute; inset: 0;
      background: var(--bg); z-index: 50;
      animation: slideUp .25s ease-out;
    }
    .side-panel.open { display: flex; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .side-panel-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: var(--dark); flex-shrink: 0; }
    .side-panel-header span { font-weight: 700; font-size: 0.92rem; color: #fff; }
    .side-panel-close { background: transparent; border: none; color: #ccc; font-size: 1rem; cursor: pointer; padding: 4px 8px; }

    /* chat msgs */
    #chatMsgs { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; background: #080808; }
    .msg-driver   { background: var(--primary); color: #fff; align-self: flex-start; padding: 8px 12px; border-radius: 12px; border-bottom-right-radius: 3px; max-width: 80%; font-size: 0.85rem; }
    .msg-customer { background: #1e1e1e; color: var(--text); align-self: flex-end; padding: 8px 12px; border-radius: 12px; border-bottom-left-radius: 3px; max-width: 80%; font-size: 0.85rem; }
    .chat-input-row { display: flex; gap: 8px; padding: 10px 12px; background: var(--bg); border-top: 1px solid var(--border); flex-shrink: 0; }
    .chat-input-row input { flex: 1; background: #111; border: 1px solid var(--border); border-radius: 20px; padding: 9px 14px; color: var(--text); font-family: 'Cairo', sans-serif; font-size: 0.88rem; outline: none; }
    .chat-input-row input::placeholder { color: #555; }
    .chat-send { width: 40px; height: 40px; border-radius: 50%; background: var(--primary); border: none; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }

    /* orders list panel */
    #ordersList { flex: 1; overflow-y: auto; padding: 12px; background: var(--bg); }

    /* ===================== OVERLAYS ===================== */
    .full-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 9000; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; }
    .full-overlay.show { display: flex; }

    .sub-input { text-align: center; font-size: 1.5rem; letter-spacing: 5px; border: 2px solid var(--border); border-radius: 14px; padding: 14px; width: 100%; max-width: 260px; margin: 18px 0; outline: none; background: #111; color: var(--text); font-family: 'Cairo', sans-serif; }
    .btn-unlock { background: var(--primary); color: #fff; width: 100%; max-width: 260px; padding: 14px; border-radius: 14px; font-weight: 700; border: none; font-size: 1rem; font-family: 'Cairo', sans-serif; cursor: pointer; }

    .car-input { width: 100%; padding: 14px; border: 2px solid var(--border); border-radius: 12px; font-size: 1rem; font-weight: 700; text-align: center; margin: 14px 0; outline: none; background: #111; color: var(--text); font-family: 'Cairo', sans-serif; }
    .car-input:focus { border-color: var(--primary); }
    .car-input::placeholder { color: #555; }
    .btn-save-car { background: var(--primary); color: #fff; width: 100%; padding: 14px; border-radius: 12px; font-weight: 800; border: none; font-size: 1rem; font-family: 'Cairo', sans-serif; cursor: pointer; }

    /* trip summary */
    #statsOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; }
    .stats-card { background: #0d0d0d; width: 100%; max-width: 300px; border-radius: 22px; padding: 26px 20px; text-align: center; border: 1px solid #222; }
    .price-big { font-size: 2rem; font-weight: 900; color: var(--primary); margin: 14px 0; }
    .btn-done { width: 100%; padding: 13px; background: var(--dark); color: #fff; border: none; border-radius: 12px; font-family: 'Cairo', sans-serif; font-weight: 800; font-size: 1rem; cursor: pointer; }

    /* toast */
    .toast-msg { position: fixed; bottom: calc(var(--panel-h) + 10px); left: 50%; transform: translateX(-50%); background: #222; color: #fff; padding: 10px 20px; border-radius: 10px; font-weight: 700; font-size: 0.88rem; z-index: 9999; animation: toastIn .3s; max-width: 88%; text-align: center; pointer-events: none; }
    @keyframes toastIn { from { opacity:0; transform: translateX(-50%) translateY(10px); } to { opacity:1; transform: translateX(-50%) translateY(0); } }

    /* Google Maps InfoWindow */
    .gm-style .gm-style-iw { font-family: 'Cairo', sans-serif !important; padding: 0 !important; overflow: hidden !important; border-radius: 12px !important; }
    .iw-inner { background: #000; color: #f0f0f0; padding: 12px; min-width: 220px; border-radius: 12px; font-family: 'Cairo', sans-serif; }
    .iw-title { font-weight: 800; color: var(--primary); margin-bottom: 8px; font-size: 0.95rem; }
    .iw-dest { background: rgba(255,111,0,.15); border: 1px solid rgba(255,111,0,.4); border-radius: 8px; padding: 6px 10px; font-size: 0.82rem; margin-bottom: 10px; }
    .iw-stats { display: flex; justify-content: space-around; background: #111; border-radius: 8px; padding: 8px; margin-bottom: 10px; border: 1px solid #222; }
    .iw-stat { display: flex; flex-direction: column; align-items: center; font-size: 0.78rem; color: #999; }
    .iw-stat span { font-weight: 900; color: var(--primary); font-size: 0.9rem; }
    .iw-btns { display: flex; gap: 8px; }
    .iw-btn-a { flex: 2; background: var(--primary); color: #fff; border: none; border-radius: 8px; padding: 9px; font-weight: 700; font-size: 0.85rem; cursor: pointer; font-family: 'Cairo', sans-serif; }
    .iw-btn-r { flex: 1; background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 9px; font-weight: 700; font-size: 0.85rem; cursor: pointer; font-family: 'Cairo', sans-serif; }
  </style>
</head>
<body>

<!-- ===== Subscription Blocker ===== -->
<div id="subBlocker" class="full-overlay">
  <i class="fas fa-id-card-alt fa-3x text-danger mb-3"></i>
  <h3 style="font-weight:800;margin-bottom:8px">الحساب مقيد</h3>
  <p style="color:#777;font-size:0.9rem;margin-bottom:0">أدخل كود الاشتراك للمتابعة</p>
  <input type="number" id="pinInput" class="sub-input" placeholder="000000">
  <button class="btn-unlock" onclick="redeemPin()">تفعيل الآن</button>
</div>

<!-- ===== Car Settings ===== -->
<div id="carModal" class="full-overlay">
  <i class="fas fa-car-side fa-3x text-warning mb-3"></i>
  <h4 style="font-weight:800;margin-bottom:6px">بيانات السيارة</h4>
  <p style="color:#777;font-size:0.88rem;margin-bottom:0">أدخل رقم لوحة سيارتك</p>
  <input type="text" id="carPlateInput" class="car-input" placeholder="بغداد 12345">
  <button class="btn-save-car" onclick="saveCarPlate()">حفظ ومتابعة</button>
</div>

<div id="app">

  <!-- ===== النصف العلوي: الخريطة ===== -->
  <div id="map-section">
    <div id="map"></div>
    <button class="map-btn" id="themeBtn"   onclick="toggleTheme()"><i class="fas fa-sun"></i></button>
    <button class="map-btn" id="voiceBtn"   onclick="toggleVoice()"><i class="fas fa-volume-up"></i></button>
    <button class="map-btn" id="recenterBtn" onclick="recenterCamera()"><i class="fas fa-location-arrow"></i></button>
  </div>

  <div class="divider"></div>

  <!-- ===== النصف السفلي: UI ===== -->
  <div id="ui-section">

    <!-- هيدر ثابت -->
    <div id="panel-header">
      <div>
        <div id="driver-name-label">🚖 <span id="driverTitle">كابتن</span></div>
        <div id="status-text">في انتظار الطلبات...</div>
      </div>
      <div class="header-btns">
        <button class="hdr-btn" id="ordersHdrBtn" onclick="toggleOrders()" title="الطلبات">
          <i class="fas fa-list-ul"></i>
        </button>
        <button class="hdr-btn" id="chatHdrBtn" onclick="toggleChat()" title="الشات" style="display:none">
          <i class="fas fa-comment-dots"></i>
        </button>
        <button class="hdr-btn danger" onclick="logout()" title="خروج">
          <i class="fas fa-sign-out-alt"></i>
        </button>
      </div>
    </div>

    <!-- المحتوى الرئيسي -->
    <div id="ui-container">
      <!-- يتم ملؤه ديناميكياً -->
    </div>

    <!-- شات (يغطي البانال كاملاً) -->
    <div id="chatPanel" class="side-panel">
      <div class="side-panel-header">
        <span><i class="fas fa-comment-dots ms-2"></i> الزبون</span>
        <button class="side-panel-close" onclick="toggleChat()"><i class="fas fa-times"></i></button>
      </div>
      <div id="chatMsgs"></div>
      <div class="chat-input-row">
        <input id="chatInput" type="text" placeholder="اكتب رسالة..." onkeypress="if(event.key==='Enter')sendMsg()">
        <button class="chat-send" onclick="sendMsg()"><i class="fas fa-paper-plane"></i></button>
      </div>
    </div>

    <!-- قائمة الطلبات (تغطي البانال كاملاً) -->
    <div id="ordersPanel" class="side-panel">
      <div class="side-panel-header">
        <span><i class="fas fa-receipt ms-2"></i> الطلبات الواردة</span>
        <button class="side-panel-close" onclick="toggleOrders()"><i class="fas fa-times"></i></button>
      </div>
      <div id="ordersList"></div>
    </div>

  </div>
</div>

<!-- ملخص الرحلة -->
<div id="statsOverlay">
  <div class="stats-card">
    <h3 style="font-weight:800;font-size:1.1rem;margin-bottom:12px">نهاية الرحلة ✅</h3>
    <div style="color:#777;font-size:0.82rem">المسافة</div>
    <div id="statDist" style="font-weight:800;font-size:1.2rem;margin:4px 0 12px">--</div>
    <div style="color:#777;font-size:0.82rem">المبلغ المستحق</div>
    <div class="price-big" id="statPrice">0 د.ع</div>
    <button class="btn-done" onclick="location.reload()">استلام وإنهاء ✓</button>
  </div>
</div>

<audio id="orderSound"  src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>
<audio id="cancelSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>
<audio id="chatSound"   src="https://assets.mixkit.co/active_storage/sfx/1717/1717-preview.mp3"></audio>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDVsOdieu4zCgOa9ZBASM05vX-DLeTmkc8&language=ar&v=beta&callback=initMap"></script>

<script>
  /* ========== Firebase ========== */
  const firebaseConfig = { apiKey:"AIzaSyDkosn3orZqLf5Dd7g32TGUarW5a3MF2Oc", databaseURL:"https://carwa-zaid-default-rtdb.firebaseio.com", projectId:"carwa-zaid" };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  /* ========== State ========== */
  let map, markers = {}, directionsService, solidRenderer;
  let driverMarker = null, driverMarkerEl = null;
  let currentOrder = null, tripStats = { distanceVal:0, distance:'' };
  let isAutoFollow = true, lastLat = 0, lastLng = 0;
  let currentHeading = 0, headingHistory = [];
  let lastFirebaseUpdate = 0, lastStatusUpdate = 0;
  const FB_INTERVAL = 3000, STATUS_INTERVAL = 5000;
  let unreadChat = 0, unreadOrders = 0;
  let voiceEnabled = true, navSteps = [], navStepIdx = 0, lastSpokenAt = 0;
  const NAV_COOLDOWN = 7000, ICON_OFFSET = -90;

  const driverName  = localStorage.getItem('carwa_driver_name')  || 'كابتن';
  const driverPhone = localStorage.getItem('carwa_driver_phone');
  const driverStatusRef = driverPhone ? db.ref('driversStatus/' + driverPhone) : null;
  let carPlate = localStorage.getItem('carwa_driver_carplate') || '';

  document.getElementById('driverTitle').textContent = driverName;

  const darkStyle  = [{ elementType:'geometry', stylers:[{color:'#242f3e'}] },{ elementType:'labels.text.stroke', stylers:[{color:'#242f3e'}] },{ elementType:'labels.text.fill', stylers:[{color:'#746855'}] },{ featureType:'road', elementType:'geometry', stylers:[{color:'#38414e'}] },{ featureType:'road', elementType:'geometry.stroke', stylers:[{color:'#212a37'}] },{ featureType:'water', elementType:'geometry', stylers:[{color:'#17263c'}] }];
  const lightStyle = [];

  /* ========== initMap ========== */
  function initMap() {
    if (window._mapOk) return; window._mapOk = true;
    const savedPos = { lat: parseFloat(localStorage.getItem('carwa_driver_lat'))||33.3152, lng: parseFloat(localStorage.getItem('carwa_driver_lng'))||44.3661 };
    map = new google.maps.Map(document.getElementById('map'), { center:savedPos, zoom:16, disableDefaultUI:true, styles:darkStyle, gestureHandling:'greedy' });
    map.addListener('dragstart', () => { isAutoFollow = false; });
    directionsService = new google.maps.DirectionsService();
    solidRenderer = new google.maps.DirectionsRenderer({ map, suppressMarkers:true, polylineOptions:{ strokeColor:'#FF6F00', strokeWeight:6, strokeOpacity:0.9 } });
    createOrUpdateDriverMarker(savedPos, 0);
    if (!carPlate) { document.getElementById('carModal').classList.add('show'); }
    if (driverStatusRef) {
      driverStatusRef.update({ name:driverName, carPlate:carPlate||null, isOnline:true, lastSeen:Date.now(), lat:savedPos.lat, lng:savedPos.lng });
      window.addEventListener('beforeunload', () => driverStatusRef.update({ isOnline:false, lastSeen:Date.now() }));
    }
    renderIdle();
    listenForOrders();
    startGPS();
    document.addEventListener('click', requestWakeLock);
  }

  /* ========== renderIdle ========== */
  function renderIdle() {
    document.getElementById('status-text').textContent = 'في انتظار الطلبات...';
    document.getElementById('ui-container').innerHTML = `
      <div class="idle-box">
        <div class="pulse-ring"></div>
        <p style="font-weight:700;font-size:0.95rem;margin-bottom:6px">جاهز لاستقبال الطلبات</p>
        <small style="color:#666">ستظهر الطلبات الجديدة هنا تلقائياً</small>
      </div>`;
  }

  /* ========== GPS ========== */
  async function requestWakeLock() {
    try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch(e) {}
  }

  function startGPS() {
    if (!navigator.geolocation) { document.getElementById('status-text').textContent = '⚠️ GPS غير مدعوم'; return; }
    navigator.geolocation.watchPosition(pos => {
      const lat = pos.coords.latitude, lng = pos.coords.longitude;
      const speed = pos.coords.speed || 0;
      let heading = pos.coords.heading;
      if (heading == null || speed < 0.5) {
        if (lastLat !== 0) heading = calcHeading(lastLat, lastLng, lat, lng);
        else heading = currentHeading;
      }
      const dist = haversine(lat, lng, lastLat, lastLng);
      if (dist < 3 && speed < 0.5) return;
      lastLat = lat; lastLng = lng;
      localStorage.setItem('carwa_driver_lat', lat);
      localStorage.setItem('carwa_driver_lng', lng);
      const latLng = new google.maps.LatLng(lat, lng);
      createOrUpdateDriverMarker(latLng, heading);
      smoothHeading(heading);
      if (driverStatusRef && Date.now() - lastStatusUpdate > STATUS_INTERVAL) {
        lastStatusUpdate = Date.now();
        driverStatusRef.update({ isOnline:true, lastSeen:Date.now(), lat, lng, heading:currentHeading });
      }
      if (isAutoFollow) {
        map.panTo(latLng);
        if (currentOrder) { map.setZoom(18); map.setTilt(55); if (heading != null) map.setHeading(heading); }
      }
      if (currentOrder) maybeSpeakNextStep(latLng);
      if (currentOrder && Date.now() - lastFirebaseUpdate > FB_INTERVAL) {
        lastFirebaseUpdate = Date.now();
        db.ref('orders/' + currentOrder.id + '/driver_location').set({ lat, lng, heading:currentHeading, speed, timestamp:Date.now() });
      }
    }, () => { document.getElementById('status-text').textContent = '⚠️ خطأ GPS'; }, { enableHighAccuracy:true, maximumAge:0, timeout:10000 });
  }

  function recenterCamera() {
    isAutoFollow = true;
    const lat = parseFloat(localStorage.getItem('carwa_driver_lat'));
    const lng = parseFloat(localStorage.getItem('carwa_driver_lng'));
    if (lat && lng) { map.panTo({ lat, lng }); map.setZoom(currentOrder ? 18 : 16); if (currentOrder) map.setTilt(55); }
  }

  function haversine(lat1,lon1,lat2,lon2) {
    if (!lat2||!lon2) return 999;
    const R=6371, dLat=(lat2-lat1)*Math.PI/180, dLon=(lon2-lon1)*Math.PI/180;
    const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))*1000;
  }

  function calcHeading(lat1,lng1,lat2,lng2) {
    const [a,b,c,d] = [lat1,lng1,lat2,lng2].map(x=>x*Math.PI/180);
    const y = Math.sin(d-b)*Math.cos(c), x = Math.cos(a)*Math.sin(c)-Math.sin(a)*Math.cos(c)*Math.cos(d-b);
    return (Math.atan2(y,x)*180/Math.PI+360)%360;
  }

  function smoothHeading(h) {
    headingHistory.push(h); if (headingHistory.length>5) headingHistory.shift();
    let avg = headingHistory.reduce((a,b)=>a+b,0)/headingHistory.length;
    if (Math.abs(avg-currentHeading)>180) avg += avg>currentHeading ? -360 : 360;
    currentHeading = avg;
    if (driverMarkerEl) { const img=driverMarkerEl.querySelector('img'); if(img) img.style.transform=`rotate(${currentHeading+ICON_OFFSET}deg)`; }
  }

  function createOrUpdateDriverMarker(pos, heading=0) {
    const hasAdv = google.maps?.marker?.AdvancedMarkerElement;
    if (hasAdv) {
      if (!driverMarkerEl) {
        const wrap = document.createElement('div'); wrap.className='driver-marker';
        wrap.innerHTML='<img src="assets/logo.png" alt="car">';
        driverMarkerEl = wrap;
        driverMarker = new google.maps.marker.AdvancedMarkerElement({ map, position:pos, content:wrap, zIndex:1000 });
      } else { driverMarker.position = pos; }
      const img = driverMarkerEl.querySelector('img');
      if (img) img.style.transform = `rotate(${heading+ICON_OFFSET}deg)`;
      return;
    }
    const icon = { url:'assets/logo.png', scaledSize:new google.maps.Size(44,44), anchor:new google.maps.Point(22,22) };
    if (!driverMarker) { driverMarker = new google.maps.Marker({ position:pos, map, icon, zIndex:1000 }); }
    else { driverMarker.setPosition(pos); }
  }

  /* ========== Orders ========== */
  function listenForOrders() {
    db.ref('orders').orderByChild('status').equalTo('pending').limitToLast(20).on('value', snap => {
      if (currentOrder) return;
      const ignored = JSON.parse(localStorage.getItem('carwa_ignored')||'[]');
      const all = snap.val() || {};
      for (let id in markers) { if (!all[id]) { markers[id].setMap(null); delete markers[id]; } }

      const list = document.getElementById('ordersList');
      if (list) list.innerHTML = '';
      let count = 0;

      snap.forEach(child => {
        const o = child.val();
        if (ignored.includes(o.id)) return;
        count++;

        // إضافة في قائمة الطلبات
        if (list) {
          const card = document.createElement('div');
          card.className = 'order-card';
          card.innerHTML = `
            <div class="order-card-title">${o.customerName||'زبون'}</div>
            <div class="order-meta">
              <div class="order-stat"><i class="fas fa-road"></i>${o.estimatedDistance||'--'}</div>
              <div class="order-stat"><i class="fas fa-clock"></i>${o.estimatedTime||'--'}</div>
            </div>
            <div class="order-btns">
              <button class="btn-accept" onclick="acceptOrder('${o.id}');toggleOrders()">
                <i class="fas fa-check me-1"></i>قبول
              </button>
              <button class="btn-reject" onclick="hideOrder('${o.id}')">رفض</button>
            </div>`;
          list.appendChild(card);
        }

        // Marker على الخريطة
        if (!markers[o.id]) {
          const m = new google.maps.Marker({ position:o.pickup, map, animation:google.maps.Animation.BOUNCE });
          const iw = new google.maps.InfoWindow({ content:`<div class="iw-inner"><div class="iw-title">${o.customerName||'زبون'}</div><div style="text-align:center;padding:10px"><div class="spinner-border spinner-border-sm text-warning"></div></div></div>` });

          directionsService.route({ origin:o.pickup, destination:o.dest, travelMode:'DRIVING' }, (res, st) => {
            let dist='--', dur='--', addr='--';
            if (st==='OK') { const leg=res.routes[0].legs[0]; dist=leg.distance.text; dur=leg.duration.text; addr=leg.end_address; }
            iw.setContent(`
              <div class="iw-inner">
                <div class="iw-title">${o.customerName||'زبون'}</div>
                <div class="iw-dest"><i class="fas fa-map-marker-alt text-danger ms-1"></i> ${addr}</div>
                <div class="iw-stats">
                  <div class="iw-stat"><i class="fas fa-road text-warning"></i><span>${dist}</span></div>
                  <div class="iw-stat"><i class="fas fa-clock text-primary"></i><span>${dur}</span></div>
                </div>
                <div class="iw-btns">
                  <button class="iw-btn-r" onclick="hideOrder('${o.id}')"><i class="fas fa-times"></i> رفض</button>
                  <button class="iw-btn-a" onclick="acceptOrder('${o.id}')"><i class="fas fa-check"></i> قبول</button>
                </div>
              </div>`);
          });

          m.addListener('click', () => iw.open(map, m));
          markers[o.id] = m;
          document.getElementById('orderSound').play().catch(()=>{});
          if (navigator.vibrate) navigator.vibrate(200);
        }
      });

      unreadOrders = count;
      const btn = document.getElementById('ordersHdrBtn');
      if (btn) count > 0 ? btn.classList.add('has-badge') : btn.classList.remove('has-badge');

      // تحديث المحتوى إذا لم تكن هناك رحلة نشطة
      if (!currentOrder) {
        if (count > 0) {
          document.getElementById('status-text').textContent = `🔔 ${count} طلب جديد`;
          document.getElementById('ui-container').innerHTML = `
            <div style="text-align:center;padding:16px 0 10px">
              <button class="btn-full btn-orange" onclick="toggleOrders()" style="max-width:260px;margin:0 auto">
                <i class="fas fa-list-ul"></i> عرض ${count} طلب
              </button>
            </div>`;
        } else {
          renderIdle();
        }
      }
    });
  }

  function hideOrder(id) {
    if (markers[id]) { markers[id].setMap(null); delete markers[id]; }
    const ig = JSON.parse(localStorage.getItem('carwa_ignored')||'[]');
    if (!ig.includes(id)) { ig.push(id); localStorage.setItem('carwa_ignored', JSON.stringify(ig)); }
  }

  function acceptOrder(id) {
    db.ref('orders/'+id).once('value').then(snap => {
      const o = snap.val(); if (!o) return;
      currentOrder = o;
      isAutoFollow = true;
      db.ref('orders/'+id).update({ status:'accepted', driver:driverName, driverPhone, carPlate: carPlate||'غير محدد' });
      for (let k in markers) { markers[k].setMap(null); } markers = {};

      // مراقبة الإلغاء
      db.ref('orders/'+id).on('value', s => {
        const v = s.val();
        if (!v || v.status === 'cancelled') {
          document.getElementById('cancelSound').play().catch(()=>{});
          if (navigator.vibrate) navigator.vibrate([100,50,100]);
          document.getElementById('status-text').textContent = '⚠️ تم إلغاء الرحلة';
          db.ref('orders/'+id).off();
          setTimeout(() => location.reload(), 1500);
        }
      });

      document.getElementById('status-text').textContent = '✅ رحلة نشطة';
      document.getElementById('chatHdrBtn').style.display = 'flex';
      initChat(id);
      renderTripAccepted(o);
      calcRoute({ lat:parseFloat(localStorage.getItem('carwa_driver_lat')), lng:parseFloat(localStorage.getItem('carwa_driver_lng')) }, o.pickup);
      buildNavSteps({ lat:parseFloat(localStorage.getItem('carwa_driver_lat')), lng:parseFloat(localStorage.getItem('carwa_driver_lng')) }, o.pickup);
      speak('تم قبول الطلب. توجه إلى الزبون.');
      requestWakeLock();
    });
  }

  function renderTripAccepted(o) {
    document.getElementById('ui-container').innerHTML = `
      <div class="trip-card">
        <div class="trip-row">
          <div class="trip-label"><i class="fas fa-user"></i> الزبون</div>
          <div class="trip-val">${o.customerName||'--'}</div>
        </div>
        <div class="trip-row">
          <div class="trip-label"><i class="fas fa-road"></i> المسافة</div>
          <div class="trip-val">${o.estimatedDistance||'--'}</div>
        </div>
        <div class="trip-row">
          <div class="trip-label"><i class="fas fa-clock"></i> الوقت</div>
          <div class="trip-val">${o.estimatedTime||'--'}</div>
        </div>
      </div>
      <button class="btn-full btn-orange" onclick="startTrip()">
        <i class="fas fa-play-circle"></i> وصلت للزبون - ابدأ الرحلة
      </button>
      <div class="btn-2col">
        <button class="btn-full btn-blue" style="margin:0" onclick="openNav('pickup')">
          <i class="fas fa-location-arrow"></i> ملاحة للزبون
        </button>
        <button class="btn-full btn-red" style="margin:0" onclick="cancelTrip()">
          <i class="fas fa-times"></i> إلغاء
        </button>
      </div>`;
  }

  function startTrip() {
    if (!currentOrder) return;
    db.ref('orders/'+currentOrder.id).update({ status:'in_progress' });
    document.getElementById('status-text').textContent = 'الرحلة جارية...';
    document.getElementById('ui-container').innerHTML = `
      <div class="trip-card">
        <div class="trip-row">
          <div class="trip-label"><i class="fas fa-flag-checkered"></i> الوجهة</div>
          <div class="trip-val" style="font-size:0.8rem">${currentOrder.dest ? (currentOrder.dest.lat?.toFixed(4)+'...') : '--'}</div>
        </div>
        <div class="trip-row">
          <div class="trip-label"><i class="fas fa-road"></i> المسافة</div>
          <div class="trip-val">${currentOrder.estimatedDistance||'--'}</div>
        </div>
      </div>
      <button class="btn-full btn-green" onclick="finishTrip()">
        <i class="fas fa-check-circle"></i> إنهاء المشوار
      </button>
      <button class="btn-full btn-gray" onclick="openNav('dest')">
        <i class="fas fa-location-arrow"></i> ملاحة إلى الوجهة
      </button>`;
    calcRoute({ lat:parseFloat(localStorage.getItem('carwa_driver_lat')), lng:parseFloat(localStorage.getItem('carwa_driver_lng')) }, currentOrder.dest, true);
    buildNavSteps({ lat:parseFloat(localStorage.getItem('carwa_driver_lat')), lng:parseFloat(localStorage.getItem('carwa_driver_lng')) }, currentOrder.dest);
    speak('بدأت الرحلة.');
  }

  function finishTrip() {
    db.ref('orders/'+currentOrder.id).off();
    const price = 500 + (tripStats.distanceVal/1000*1000);
    document.getElementById('statDist').textContent  = tripStats.distance||'--';
    document.getElementById('statPrice').textContent = Math.round(price).toLocaleString()+' د.ع';
    document.getElementById('statsOverlay').style.display = 'flex';
    db.ref('orders/'+currentOrder.id).update({ status:'completed', cost:price });
  }

  function cancelTrip() {
    if (!confirm('إلغاء الرحلة؟')) return;
    db.ref('orders/'+currentOrder.id).update({ status:'cancelled' });
    location.reload();
  }

  /* ========== Navigation ========== */
  function calcRoute(start, end, saveStats=false) {
    directionsService.route({ origin:start, destination:end, travelMode:google.maps.TravelMode.DRIVING }, (res, st) => {
      if (st==='OK') {
        solidRenderer.setDirections(res);
        if (saveStats && res.routes[0].legs[0]) { const l=res.routes[0].legs[0]; tripStats={ distance:l.distance.text, distanceVal:l.distance.value }; }
      }
    });
  }

  function buildNavSteps(start, end) {
    navSteps=[]; navStepIdx=0;
    directionsService.route({ origin:start, destination:end, travelMode:google.maps.TravelMode.DRIVING }, (res, st) => {
      if (st!=='OK'||!res.routes?.[0]?.legs?.[0]) return;
      const tmp = document.createElement('div');
      navSteps = (res.routes[0].legs[0].steps||[]).map(s => { tmp.innerHTML=s.instructions||''; return { instruction:(tmp.textContent||'').trim(), end:s.end_location }; }).filter(s=>s.instruction&&s.end);
      navStepIdx=0;
      if (navSteps[0]?.instruction) speak(navSteps[0].instruction);
    });
  }

  function maybeSpeakNextStep(latLng) {
    if (!voiceEnabled||!navSteps.length||navStepIdx>=navSteps.length) return;
    const next = navSteps[navStepIdx];
    const dx = (latLng.lat()-next.end.lat())*111320, dy = (latLng.lng()-next.end.lng())*111320;
    const dist = Math.sqrt(dx*dx+dy*dy);
    if (dist < 35) { navStepIdx++; if (navSteps[navStepIdx]?.instruction) speak(navSteps[navStepIdx].instruction); }
  }

  function openNav(target) {
    if (!currentOrder) return;
    const lat = parseFloat(localStorage.getItem('carwa_driver_lat'));
    const lng = parseFloat(localStorage.getItem('carwa_driver_lng'));
    const dest = target==='pickup' ? currentOrder.pickup : currentOrder.dest;
    if (!dest) return;
    window.open(`https://www.google.com/maps/dir/?api=1&origin=${lat},${lng}&destination=${dest.lat},${dest.lng}&travelmode=driving&dir_action=navigate`, '_blank');
  }

  /* ========== Voice ========== */
  function speak(text) {
    if (!voiceEnabled||!('speechSynthesis' in window)) return;
    const now=Date.now(); if (now-lastSpokenAt<NAV_COOLDOWN) return;
    lastSpokenAt=now;
    try { window.speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='ar-IQ'; window.speechSynthesis.speak(u); } catch(e){}
  }

  function toggleVoice() {
    voiceEnabled = !voiceEnabled;
    const i = document.querySelector('#voiceBtn i');
    if (i) i.className = voiceEnabled ? 'fas fa-volume-up' : 'fas fa-volume-mute';
    toast(voiceEnabled ? '🔊 الصوت مفعّل' : '🔇 الصوت متوقف');
  }

  /* ========== Theme ========== */
  function toggleTheme() {
    document.body.classList.toggle('light');
    const isLight = document.body.classList.contains('light');
    map?.setOptions({ styles: isLight ? lightStyle : darkStyle });
    const i = document.querySelector('#themeBtn i');
    if (i) i.className = isLight ? 'fas fa-moon' : 'fas fa-sun';
  }

  /* ========== Chat ========== */
  function toggleChat() {
    const p = document.getElementById('chatPanel');
    const b = document.getElementById('chatHdrBtn');
    p.classList.toggle('open');
    if (p.classList.contains('open')) { unreadChat=0; b.classList.remove('has-badge'); }
  }

  function toggleOrders() {
    document.getElementById('ordersPanel').classList.toggle('open');
    unreadOrders=0;
    document.getElementById('ordersHdrBtn').classList.remove('has-badge');
  }

  function initChat(id) {
    if (window._chatId===id) return; window._chatId=id;
    const msgs = document.getElementById('chatMsgs');
    msgs.innerHTML = '';
    db.ref('chats/'+id).limitToLast(50).on('child_added', snap => {
      const m = snap.val();
      const div = document.createElement('div');
      div.className = m.sender==='driver' ? 'msg-driver' : 'msg-customer';
      div.textContent = m.text;
      msgs.appendChild(div); msgs.scrollTop = msgs.scrollHeight;
      const panel = document.getElementById('chatPanel');
      if (m.sender!=='driver' && !panel.classList.contains('open')) {
        unreadChat++;
        document.getElementById('chatHdrBtn').classList.add('has-badge');
        document.getElementById('chatSound').play().catch(()=>{});
        if (navigator.vibrate) navigator.vibrate(80);
      }
    });
  }

  function sendMsg() {
    const input = document.getElementById('chatInput');
    const txt = input?.value.trim();
    if (!txt||!currentOrder) return;
    db.ref('chats/'+currentOrder.id).push({ sender:'driver', text:txt, time:Date.now() });
    input.value = '';
  }

  /* ========== Car Plate ========== */
  function saveCarPlate() {
    const v = document.getElementById('carPlateInput').value.trim();
    if (!v) { toast('أدخل رقم اللوحة'); return; }
    carPlate = v; localStorage.setItem('carwa_driver_carplate', v);
    document.getElementById('carModal').classList.remove('show');
    toast('تم الحفظ ✓');
  }

  /* ========== Subscription ========== */
  function checkSubscription() {
    if (!driverPhone) { if (typeof google!=='undefined') initMap(); else window.initMap=initMap; return; }
    db.ref('users/drivers/'+driverPhone).once('value', snap => {
      const u = snap.val();
      if (u && (new Date()>new Date(u.subscriptionExpiry)||u.isLocked)) {
        document.getElementById('subBlocker').classList.add('show');
      } else {
        if (typeof google!=='undefined') initMap(); else window.initMap=initMap;
      }
    });
  }

  function redeemPin() {
    const pin = document.getElementById('pinInput').value;
    db.ref('pins/'+pin).once('value', snap => {
      if (snap.exists()) {
        const exp = new Date(); exp.setDate(exp.getDate()+30);
        db.ref('users/drivers/'+driverPhone).update({ subscriptionExpiry:exp.toISOString(), isLocked:false });
        db.ref('pins/'+pin).remove();
        location.reload();
      } else { toast('الكود غير صحيح'); }
    });
  }

  function logout() { localStorage.clear(); window.location.href = 'index.html'; }

  function toast(msg) {
    const el = document.createElement('div');
    el.className='toast-msg'; el.textContent=msg;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 2500);
  }

  checkSubscription();
</script>
</body>
