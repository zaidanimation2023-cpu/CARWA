<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000">
  <title>كروة 2026 - الزبون</title>
  <link rel="preconnect" href="https://carwa-zaid-default-rtdb.firebaseio.com">
  <link rel="preconnect" href="https://maps.googleapis.com">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #FF6F00;
      --dark: #2D3436;
      --bg: #000;
      --text: #f0f0f0;
      --border: #1e1e1e;
      --panel: #0a0a0a;
      --panel-h: 50vh;   /* ارتفاع البانال السفلي */
      --map-h: 50vh;     /* ارتفاع الخريطة العلوي */
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      font-family: 'Cairo', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* ===================== LAYOUT ===================== */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100%;
    }

    /* --- النصف العلوي: الخريطة --- */
    #map-section {
      position: relative;
      height: var(--map-h);
      flex-shrink: 0;
      background: #111;
    }

    #map {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0; left: 0;
    }

    /* أزرار فوق الخريطة */
    .map-btn {
      position: absolute;
      z-index: 10;
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s;
      backdrop-filter: blur(8px);
    }
    .map-btn:active { transform: scale(0.88); }

    #logoutBtn {
      top: 10px; left: 10px;
      width: 44px; height: 44px;
      background: rgba(0,0,0,0.75);
      border: 1px solid #333;
      color: #ef5350;
      font-size: 1rem;
    }

    #recenterBtn {
      bottom: 10px; right: 10px;
      width: 44px; height: 44px;
      background: rgba(0,0,0,0.75);
      border: 1px solid #333;
      color: var(--primary);
      font-size: 1rem;
    }

    /* --- الفاصل بين الخريطة والبانال --- */
    .divider {
      height: 4px;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
      flex-shrink: 0;
    }

    /* --- النصف السفلي: UI --- */
    #ui-section {
      flex: 1;
      height: var(--panel-h);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* شريط العنوان */
    #panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px 8px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #panel-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--primary);
    }
    #chatToggleBtn {
      display: none;
      width: 38px; height: 38px;
      border-radius: 50%;
      background: #111;
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 1rem;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: .15s;
    }
    #chatToggleBtn.show { display: flex; }
    #chatToggleBtn.has-unread::after {
      content: '';
      position: absolute;
      top: 5px; right: 5px;
      width: 9px; height: 9px;
      border-radius: 50%;
      background: #ff5252;
    }

    /* محتوى الـ UI المتغير */
    #ui-container {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
    }
    #ui-container::-webkit-scrollbar { width: 3px; }
    #ui-container::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }

    /* ===================== UI COMPONENTS ===================== */
    .panel-title-text {
      font-size: 1rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 12px;
    }

    .search-input {
      width: 100%;
      border-radius: 12px;
      padding: 12px 14px;
      border: 2px solid var(--border);
      background: #111;
      color: var(--text);
      font-family: 'Cairo', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      outline: none;
    }
    .search-input:focus { border-color: var(--primary); background: #161616; }
    .search-input::placeholder { color: #555; }

    .btn-confirm {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: none;
      font-family: 'Cairo', sans-serif;
      font-weight: 800;
      font-size: 0.95rem;
      color: #fff;
      background: var(--dark);
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: .15s;
      min-height: 48px;
    }
    .btn-confirm:active { transform: scale(0.97); }
    .btn-primary-action { background: var(--primary); box-shadow: 0 6px 18px rgba(255,111,0,0.3); }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 12px;
      background: #111;
      border-radius: 10px;
      margin-bottom: 8px;
      border: 1px solid var(--border);
      font-size: 0.88rem;
    }
    .stat-row span:last-child { font-weight: 800; color: var(--primary); }

    /* بطاقة معلومات السائق */
    .driver-card {
      background: #0f0f0f;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .driver-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }
    .driver-row:last-child { border-bottom: none; padding-bottom: 0; }
    .driver-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #888;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .driver-label i { color: var(--primary); width: 18px; text-align: center; }
    .driver-value { font-weight: 800; font-size: 0.9rem; }
    .plate-box {
      background: var(--dark);
      color: #fff;
      padding: 5px 14px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 1rem;
      letter-spacing: 2px;
      font-weight: 900;
    }

    .status-pill {
      display: inline-block;
      background: rgba(255,111,0,0.15);
      color: var(--primary);
      border: 1px solid rgba(255,111,0,0.35);
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .action-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .btn-action {
      flex: 1;
      border: none;
      padding: 11px 6px;
      border-radius: 11px;
      font-family: 'Cairo', sans-serif;
      font-weight: 700;
      font-size: 0.82rem;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      min-height: 44px;
      transition: .15s;
    }
    .btn-action:active { transform: scale(0.95); }
    .btn-call   { background: #2980b9; }
    .btn-cancel { background: #c0392b; }
    .btn-chat-a { background: #8e44ad; }

    /* انتظار */
    .waiting-box {
      text-align: center;
      padding: 20px 10px;
    }
    .waiting-box .spin {
      width: 48px; height: 48px;
      border: 4px solid #222;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===================== CHAT PANEL ===================== */
    #chat-panel {
      display: none;
      flex-direction: column;
      position: absolute;
      inset: 0;
      background: var(--bg);
      z-index: 50;
      animation: slideUp .25s ease-out;
    }
    #chat-panel.open { display: flex; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--dark);
      flex-shrink: 0;
    }
    .chat-header span { font-weight: 700; font-size: 0.95rem; }
    .chat-close {
      background: transparent; border: none; color: #ccc;
      font-size: 1.1rem; cursor: pointer; padding: 4px 8px;
    }

    #chatMsgs {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #080808;
    }
    .msg {
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 0.85rem;
      max-width: 80%;
      word-wrap: break-word;
      line-height: 1.4;
    }
    .msg.me    { background: var(--primary); color: #fff; align-self: flex-start; border-bottom-right-radius: 3px; }
    .msg.other { background: #1e1e1e; color: var(--text); align-self: flex-end; border-bottom-left-radius: 3px; }

    .chat-input-row {
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      background: var(--bg);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .chat-input-row input {
      flex: 1;
      background: #111;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 9px 14px;
      color: var(--text);
      font-family: 'Cairo', sans-serif;
      font-size: 0.88rem;
      outline: none;
    }
    .chat-input-row input::placeholder { color: #555; }
    .chat-send {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--primary);
      border: none;
      color: #fff;
      font-size: 0.95rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* ===================== TRIP SUMMARY ===================== */
    #statsOverlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .stats-card {
      background: #0d0d0d;
      width: 100%; max-width: 320px;
      border-radius: 22px;
      padding: 28px 22px;
      text-align: center;
      border: 1px solid #222;
    }
    .price-big { font-size: 2rem; font-weight: 900; color: var(--primary); margin: 14px 0; }
    .btn-done {
      width: 100%; padding: 13px;
      background: var(--dark); color: #fff;
      border: none; border-radius: 12px;
      font-family: 'Cairo', sans-serif;
      font-weight: 800; font-size: 1rem;
      cursor: pointer; margin-top: 6px;
    }

    /* Toast */
    .toast-msg {
      position: fixed;
      bottom: calc(var(--panel-h) + 12px);
      left: 50%; transform: translateX(-50%);
      background: #222; color: #fff;
      padding: 10px 22px; border-radius: 10px;
      font-weight: 700; font-size: 0.88rem;
      z-index: 9999;
      animation: toastIn .3s;
      max-width: 88%; text-align: center;
      pointer-events: none;
    }
    @keyframes toastIn { from { opacity:0; transform: translateX(-50%) translateY(12px); } to { opacity:1; transform: translateX(-50%) translateY(0); } }
  </style>
</head>
<body>

<div id="app">

  <!-- ===== النصف العلوي: الخريطة ===== -->

      <i class="fas fa-sign-out-alt"></i>

<!-- ===== نظام الإشعارات الصوتية كروة ===== -->
<script>
// ============================================================
//  🔔 كروة - نظام الإشعارات الصوتية الشامل (الزبون)
//  يعمل حتى عند إقفال الشاشة عبر Service Worker
// ============================================================
const CarwaNotifications = (() => {
  let audioCtx = null;
  function getCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function playTone(frequencies, durations, type = 'sine', vol = 0.6) {
    try {
      const ctx = getCtx();
      frequencies.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = type; osc.frequency.value = freq;
        const t0 = durations.slice(0, i).reduce((a, b) => a + b, 0);
        const start = ctx.currentTime + t0;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(vol, start + 0.01);
        gain.gain.linearRampToValueAtTime(0, start + durations[i] - 0.01);
        osc.start(start); osc.stop(start + durations[i]);
      });
    } catch(e) {}
  }
  const sounds = {
    accepted:      () => playTone([523,659,784,1047],        [0.13,0.13,0.13,0.35], 'sine',     0.6),
    cancelled:     () => playTone([600,400,250],             [0.18,0.2,0.4],        'sawtooth', 0.45),
    driverArrived: () => playTone([784,784,0,784,784,0,1047],[0.1,0.1,0.06,0.1,0.1,0.06,0.4],'sine',0.65),
    chat:          () => playTone([880,1100],                [0.09,0.15],           'sine',     0.4),
    completed:     () => playTone([523,659,784,659,784,1047],[0.1,0.1,0.1,0.08,0.08,0.45],'sine',0.55),
    orderSent:     () => playTone([440,550],                 [0.1,0.22],            'sine',     0.4),
    tripStarted:   () => playTone([659,784,1047],            [0.13,0.13,0.35],      'sine',     0.55),
    alert:         () => playTone([700,700],                 [0.1,0.12],            'square',   0.35),
  };
  const vibrations = {
    accepted:      [200,100,200,100,300],
    cancelled:     [400,150,400],
    driverArrived: [300,100,300,100,400],
    chat:          [100],
    completed:     [200,100,200,100,300],
    orderSent:     [150,80,150],
    tripStarted:   [200,100,300],
    alert:         [200],
  };
  async function notify(title, body, type = 'alert') {
    if (sounds[type]) sounds[type]();
    if (navigator.vibrate) navigator.vibrate(vibrations[type] || [200]);
    // إرسال عبر Service Worker (يعمل حتى عند إقفال الشاشة)
    if (navigator.serviceWorker && navigator.serviceWorker.controller) {
      navigator.serviceWorker.controller.postMessage({
        type: 'SHOW_NOTIFICATION', title, body, notifType: type, url: location.pathname
      });
    } else if (Notification.permission === 'granted') {
      try {
        const reg = await navigator.serviceWorker.ready;
        reg.showNotification(title, {
          body, icon: 'assets/logo.png', badge: 'assets/logo.png',
          vibrate: vibrations[type] || [200],
          dir: 'rtl', lang: 'ar', tag: type, renotify: true,
          requireInteraction: ['accepted','driverArrived'].includes(type),
          data: { type }
        });
      } catch(e) {
        try { new Notification(title, { body, icon: 'assets/logo.png', dir: 'rtl', lang: 'ar' }); } catch(e2) {}
      }
    }
  }
  async function requestPermission() {
    if (!('Notification' in window)) return false;
    if (Notification.permission === 'granted') return true;
    if (Notification.permission === 'denied') return false;
    return (await Notification.requestPermission()) === 'granted';
  }
  function unlock() { try { getCtx(); } catch(e) {} document.removeEventListener('click', unlock); document.removeEventListener('touchstart', unlock); }
  document.addEventListener('click', unlock);
  document.addEventListener('touchstart', unlock);
  return { sounds, notify, requestPermission };
})();
</script>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
  /* ========== Firebase ========== */
  const firebaseConfig = { apiKey:"AIzaSyDkosn3orZqLf5Dd7g32TGUarW5a3MF2Oc", databaseURL:"https://carwa-zaid-default-rtdb.firebaseio.com", projectId:"carwa-zaid" };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  /* ========== State ========== */
  let map, pickupMarker, destMarker, driverMarker, directionsService, solidRenderer, dashedRenderer;
  let currentStep = 'pickup', pickupPos, destPos;
  let activeOrderId = null, driverData = null, orderRef = null;
  let lastRenderStatus = '', unreadChat = 0;
  let driversMarkers = {};

  const customerName  = localStorage.getItem('carwa_user_name')  || 'عميل';
  const customerPhone = localStorage.getItem('carwa_user_phone') || '';
  const savedLat = parseFloat(localStorage.getItem('carwa_last_lat')) || 33.3152;
  const savedLng = parseFloat(localStorage.getItem('carwa_last_lng')) || 44.3661;
  const defaultPos = { lat: savedLat, lng: savedLng };

  const darkStyle = [
    { elementType:'geometry',           stylers:[{color:'#242f3e'}] },
    { elementType:'labels.text.stroke', stylers:[{color:'#242f3e'}] },
    { elementType:'labels.text.fill',   stylers:[{color:'#746855'}] },
    { featureType:'road', elementType:'geometry',        stylers:[{color:'#38414e'}] },
    { featureType:'road', elementType:'geometry.stroke', stylers:[{color:'#212a37'}] },
    { featureType:'water', elementType:'geometry',       stylers:[{color:'#17263c'}] }
  ];

  /* ========== initMap ========== */
  function initMap() {
    map = new google.maps.Map(document.getElementById('map'), {
      center: defaultPos, zoom: 16,
      disableDefaultUI: true, styles: darkStyle,
      gestureHandling: 'greedy'
    });
    pickupMarker = new google.maps.Marker({
      map, position: defaultPos, draggable: true,
      label: { text:'A', color:'#fff', fontWeight:'bold' }
    });
    directionsService = new google.maps.DirectionsService();
    solidRenderer  = new google.maps.DirectionsRenderer({ map, suppressMarkers:true, polylineOptions:{ strokeColor:'#FF6F00', strokeWeight:6 } });
    dashedRenderer = new google.maps.DirectionsRenderer({ map, suppressMarkers:true, polylineOptions:{ strokeOpacity:0, icons:[{ icon:{ path:'M 0,-1 0,1', strokeOpacity:1, scale:3 }, offset:'0', repeat:'20px' }], strokeColor:'#666', strokeWeight:2 } });
    renderUI();
    fetchUserLocation();
    subscribeNearbyDrivers();
    // طلب إذن الإشعارات تلقائياً
    setTimeout(() => CarwaNotifications.requestPermission(), 1500);
  }

  /* ========== GPS ========== */
  function fetchUserLocation() {
    if (!navigator.geolocation || currentStep !== 'pickup') return;
    navigator.geolocation.getCurrentPosition(pos => {
      const p = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      map.panTo(p); pickupMarker.setPosition(p); pickupPos = p;
      localStorage.setItem('carwa_last_lat', p.lat);
      localStorage.setItem('carwa_last_lng', p.lng);
    }, ()=>{}, { enableHighAccuracy:true, maximumAge:60000 });
  }

  function recenterCameraOnUser() {
    const icon = document.querySelector('#recenterBtn i');
    icon.classList.add('fa-spin');
    navigator.geolocation?.getCurrentPosition(pos => {
      const p = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      map.panTo(p); map.setZoom(17);
      if (currentStep === 'pickup') { pickupMarker.setPosition(p); pickupPos = p; }
      icon.classList.remove('fa-spin');
    }, () => { toast('فعّل الـ GPS'); icon.classList.remove('fa-spin'); }, { enableHighAccuracy:true });
  }

  /* ========== renderUI ========== */
  function renderUI(statusText='') {
    const c = document.getElementById('ui-container');
    const title = document.getElementById('panel-title');

    if (currentStep === 'pickup') {
      title.textContent = `أهلاً ${customerName} 👋`;
      c.innerHTML = `
        <p class="panel-title-text">أين موقعك الحالي؟</p>
        <input id="pac-input" class="search-input" placeholder="ابحث عن مكانك...">
        <button class="btn-confirm" onclick="confirmPickup()">
          <i class="fas fa-map-marker-alt"></i> تأكيد موقع الانطلاق
        </button>`;
      activateSearch();

    } else if (currentStep === 'dropoff') {
      title.textContent = 'اختر وجهتك 📍';
      c.innerHTML = `
        <p class="panel-title-text">إلى أين تريد الذهاب؟</p>
        <input id="pac-input" class="search-input" placeholder="ابحث عن وجهتك...">
        <button class="btn-confirm" onclick="confirmDestination()">
          <i class="fas fa-flag-checkered"></i> تأكيد الوجهة
        </button>`;
      activateSearch();

    } else if (currentStep === 'confirm') {
      title.textContent = 'ملخص الرحلة 🗺️';
      const distM = (() => { const m = (window.estimatedDist||'').match(/([\d.]+)\s*km/i); return m ? parseFloat(m[1])*1000 : 0; })();
      const fare  = (500 + Math.round(distM)).toLocaleString() + ' د.ع';
      c.innerHTML = `
        <div class="stat-row"><span>المسافة</span><span>${window.estimatedDist||'--'}</span></div>
        <div class="stat-row"><span>الوقت تقريباً</span><span>${window.estimatedTime||'--'}</span></div>
        <div class="stat-row"><span>التكلفة تقريباً</span><span>${fare}</span></div>
        <button id="sendOrderBtn" class="btn-confirm btn-primary-action" onclick="sendOrder()">
          <i class="fas fa-taxi"></i> اطلب كروة الآن
        </button>`;

    } else if (currentStep === 'waiting') {
      title.textContent = 'جاري البحث...';
      c.innerHTML = `
        <div class="waiting-box">
          <div class="spin"></div>
          <p style="font-weight:700;margin-bottom:6px">يتم البحث عن كابتن قريب</p>
          <small style="color:#666">سيصلك إشعار عند القبول</small>
          <button class="btn-confirm" style="background:#c0392b;margin-top:16px" onclick="cancelOrder()">
            <i class="fas fa-times"></i> إلغاء الطلب
          </button>
        </div>`;

    } else if (currentStep === 'tracking') {
      title.textContent = 'رحلتك جارية 🚖';
      const d = driverData || {};
      c.innerHTML = `
        <div class="driver-card">
          <div class="driver-row">
            <div class="driver-label"><i class="fas fa-user"></i> السائق</div>
            <div class="driver-value">${d.driver||'الكابتن'}</div>
          </div>
          <div class="driver-row">
            <div class="driver-label"><i class="fas fa-phone"></i> الهاتف</div>
            <div class="driver-value">
              <a href="tel:${d.driverPhone||''}" style="color:var(--primary);text-decoration:none">${d.driverPhone||'--'}</a>
            </div>
          </div>
          <div class="driver-row" style="justify-content:center;padding-top:10px">
            <div class="plate-box"><i class="fas fa-car-side ms-2"></i>${d.carPlate||'-----'}</div>
          </div>
        </div>
        <div style="text-align:center"><span class="status-pill">${statusText}</span></div>
        <div class="action-row">
          <a href="tel:${d.driverPhone||''}" class="btn-action btn-call text-decoration-none">
            <i class="fas fa-phone-alt"></i> اتصال
          </a>
          <button class="btn-action btn-chat-a" onclick="toggleChat()">
            <i class="fas fa-comment"></i> رسالة
          </button>
          <button class="btn-action btn-cancel" onclick="cancelOrder()">
            <i class="fas fa-times"></i> إلغاء
          </button>
        </div>`;
      document.getElementById('chatToggleBtn').classList.add('show');
      if (activeOrderId) initChat(activeOrderId);
    }
  }

  /* ========== Steps ========== */
  function confirmPickup() {
    const pos = pickupMarker.getPosition();
    pickupPos = { lat: pos.lat(), lng: pos.lng() };
    localStorage.setItem('carwa_last_lat', pickupPos.lat);
    localStorage.setItem('carwa_last_lng', pickupPos.lng);
    const bPos = { lat: pickupPos.lat + 0.0004, lng: pickupPos.lng + 0.0003 };
    if (!destMarker) {
      destMarker = new google.maps.Marker({ map, position: bPos, draggable:true, label:{ text:'B', color:'#fff', fontWeight:'bold' } });
    } else { destMarker.setMap(map); destMarker.setPosition(bPos); }
    const bounds = new google.maps.LatLngBounds();
    bounds.extend(pos); bounds.extend(new google.maps.LatLng(bPos.lat, bPos.lng));
    map.fitBounds(bounds);
    currentStep = 'dropoff'; renderUI();
  }

  function confirmDestination() {
    const b = destMarker ? destMarker.getPosition() : map.getCenter();
    destPos = { lat: b.lat(), lng: b.lng() };
    currentStep = 'confirm'; renderUI();
    directionsService.route({ origin: pickupPos, destination: destPos, travelMode:'DRIVING' }, res => {
      if (res.status === 'OK') {
        dashedRenderer.setDirections(res);
        const leg = res.routes[0].legs[0];
        window.estimatedTime = leg.duration?.text || '--';
        window.estimatedDist = leg.distance?.text || '--';
        if (currentStep === 'confirm') renderUI();
      }
    });
  }

  /* ========== Order ========== */
  function sendOrder() {
    const oId = 'ID_' + Date.now();
    activeOrderId = oId;
    const orderData = {
      id: oId, pickup: pickupPos, dest: destPos, status: 'pending',
      customerName, customerPhone, timestamp: Date.now(),
      estimatedDistance: window.estimatedDist || '--',
      estimatedTime: window.estimatedTime || '--'
    };
    const btn = document.getElementById('sendOrderBtn');
    if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>جاري...'; }
    db.ref('orders/' + oId).set(orderData)
      .then(() => {
        CarwaNotifications.notify('تم إرسال طلبك 🚕', 'جاري البحث عن كابتن قريب...', 'orderSent');
        currentStep = 'waiting'; renderUI(); trackOrder(oId);
      })
      .catch(() => { toast('خطأ في الإرسال'); if(btn){btn.disabled=false;btn.innerHTML='<i class="fas fa-taxi"></i> اطلب كروة الآن';} });
  }

  function trackOrder(orderId) {
    if (orderRef) orderRef.off();
    orderRef = db.ref('orders/' + orderId);
    orderRef.on('value', snap => {
      const data = snap.val(); if (!data) return;
      driverData = data;
      if (data.status === 'cancelled') {
        CarwaNotifications.notify('تم إلغاء الرحلة ❌', 'تم إلغاء رحلتك', 'cancelled');
        toast('تم إلغاء الرحلة'); if(orderRef)orderRef.off(); setTimeout(()=>location.reload(),1500);
      }
      if (data.status === 'accepted' || data.status === 'in_progress') {
        if (!window.driverFoundPlayed) {
          if (data.status === 'accepted') {
            CarwaNotifications.notify('تم قبول طلبك! 🚗', `الكابتن ${data.driver||''} في الطريق إليك`, 'accepted');
          } else {
            CarwaNotifications.notify('الرحلة بدأت! 🛣️', 'أنت الآن في رحلتك', 'tripStarted');
          }
          window.driverFoundPlayed = true;
          if (navigator.vibrate) navigator.vibrate([200,100,200]);
        }
        currentStep = 'tracking';
        const msg = data.status === 'accepted' ? 'الكابتن في الطريق إليك 🚗' : 'أنت في الرحلة الآن 🛣️';
        if (lastRenderStatus !== msg) { lastRenderStatus = msg; renderUI(msg); }
        if (data.driver_location) {
          updateDriverMarker(data.driver_location);
          const target = data.status === 'accepted' ? pickupPos : destPos;
          if (!window.lastRouteStatus || window.lastRouteStatus !== data.status) {
            directionsService.route({ origin: data.driver_location, destination: target, travelMode:'DRIVING' }, res => {
              if (res.status === 'OK') solidRenderer.setDirections(res);
            });
            window.lastRouteStatus = data.status;
          }
        }
      }
      if (data.status === 'completed') { if(orderRef)orderRef.off(); showTripSummary(data); }
    });
  }

  function updateDriverMarker(loc) {
    const pos = { lat: loc.lat, lng: loc.lng };
    if (!driverMarker) {
      driverMarker = new google.maps.Marker({
        position: pos, map,
        icon: { path:'M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z',
          fillColor:'#FF6F00', fillOpacity:1, strokeColor:'#fff', strokeWeight:2, scale:2,
          anchor: new google.maps.Point(12,22) }
      });
    } else { driverMarker.setPosition(pos); }
  }

  /* ========== Nearby Drivers ========== */
  function subscribeNearbyDrivers() {
    db.ref('driversStatus').on('value', snap => {
      const data = snap.val() || {};
      const seen = new Set();
      Object.keys(data).forEach(phone => {
        const d = data[phone];
        if (!d || !d.isOnline || d.lat == null) return;
        seen.add(phone);
        let m = driversMarkers[phone];
        if (!m) {
          m = new google.maps.Marker({
            position: { lat: d.lat, lng: d.lng }, map,
            icon: { url:'assets/logo.png', scaledSize: new google.maps.Size(28,28), anchor: new google.maps.Point(14,14) },
            title: d.name || 'كابتن'
          });
          driversMarkers[phone] = m;
        } else { m.setPosition({ lat: d.lat, lng: d.lng }); }
      });
      Object.keys(driversMarkers).forEach(p => { if (!seen.has(p)) { driversMarkers[p].setMap(null); delete driversMarkers[p]; } });
    });
  }

  /* ========== Chat ========== */
  function toggleChat() {
    const panel = document.getElementById('chat-panel');
    const btn   = document.getElementById('chatToggleBtn');
    panel.classList.toggle('open');
    if (panel.classList.contains('open')) {
      unreadChat = 0; btn.classList.remove('has-unread');
    }
  }

  function initChat(id) {
    if (window._chatInitId === id) return;
    window._chatInitId = id;
    const msgs = document.getElementById('chatMsgs');
    msgs.innerHTML = '';
    db.ref('chats/' + id).limitToLast(50).on('child_added', snap => {
      const m = snap.val();
      const div = document.createElement('div');
      div.className = `msg ${m.sender === 'customer' ? 'me' : 'other'}`;
      div.innerText = m.text;
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
      const panel = document.getElementById('chat-panel');
      if (m.sender !== 'customer' && !panel.classList.contains('open')) {
        unreadChat++;
        document.getElementById('chatToggleBtn').classList.add('has-unread');
        CarwaNotifications.notify('رسالة جديدة من الكابتن 💬', m.text, 'chat');
      }
    });
  }

  function sendMsg() {
    const input = document.getElementById('chatInput');
    if (!input?.value.trim() || !activeOrderId) return;
    db.ref('chats/' + activeOrderId).push({ sender:'customer', text:input.value.trim(), time:Date.now() });
    input.value = '';
  }

  /* ========== Search Autocomplete ========== */
  function activateSearch() {
    setTimeout(() => {
      const input = document.getElementById('pac-input');
      if (!input || input.dataset.ac) return;
      input.dataset.ac = '1';
      const auto = new google.maps.places.Autocomplete(input, { componentRestrictions:{ country:'iq' } });
      auto.addListener('place_changed', () => {
        const p = auto.getPlace();
        if (p.geometry) {
          map.setCenter(p.geometry.location);
          if (currentStep === 'pickup') pickupMarker.setPosition(p.geometry.location);
          if (currentStep === 'dropoff' && destMarker) destMarker.setPosition(p.geometry.location);
        }
      });
    }, 300);
  }

  /* ========== Trip Summary ========== */
  function showTripSummary(data) {
    document.getElementById('statDist').textContent  = data.distance  || window.estimatedDist || '--';
    document.getElementById('statTime').textContent  = data.duration  || window.estimatedTime || '--';
    document.getElementById('statPrice').textContent = (data.cost||0).toLocaleString() + ' د.ع';
    document.getElementById('statsOverlay').style.display = 'flex';
    CarwaNotifications.notify('وصلت إلى وجهتك! 🎉', `المسافة: ${data.distance||window.estimatedDist||'--'} | السعر: ${(data.cost||0).toLocaleString()} د.ع`, 'completed');
  }

  /* ========== Cancel / Logout ========== */
  function cancelOrder() {
    if (!activeOrderId) { toast('لا يوجد طلب نشط'); return; }
    if (!confirm('إلغاء الرحلة؟')) return;
    db.ref('orders/' + activeOrderId).update({ status:'cancelled', cancelled_by:'customer', cancelled_at:Date.now() })
      .then(() => location.reload()).catch(() => toast('خطأ في الإلغاء'));
  }

  function logout() { localStorage.clear(); window.location.href = 'index.html'; }

  function toast(msg) {
    const el = document.createElement('div');
    el.className = 'toast-msg'; el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2500);
  }
</script>
<script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDVsOdieu4zCgOa9ZBASM05vX-DLeTmkc8&libraries=places&language=ar&callback=initMap"></script>
